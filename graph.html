alk", "family": "spine", "summary": "Data was rarely on the machine that needed it.", "exists": true}, {"id": "06-anyone-can-publish.md", "title": "6. Anyone can publish", "family": "spine", "summary": "Software used to be shipped to every user's machine, and every copy aged on its own.", "exists": true}, {"id": "07-strangers-on-the-network.md", "title": "7. Strangers on the network", "family": "spine", "summary": "Early networks connected people who knew each other, so systems trusted whoever was on the other end.", "exists": true}, {"id": "08-too-many-users-too-much-data.md", "title": "8. Too many users, too much data", "family": "spine", "summary": "One machine holds only so much data and answers only so many requests.", "exists": true}, {"id": "09-buying-computers-is-too-slow.md", "title": "9. Buying computers is too slow", "family": "spine", "summary": "To run software you needed computers, and computers had to be bought, shipped, racked and paid for before anyone knew whether the software would be used.", "exists": true}, {"id": "10-many-people-one-codebase.md", "title": "10. Many people, one codebase", "family": "spine", "summary": "Once dozens of people changed the same code, their changes collided, overwrote each other, and broke things nobody had touched.", "exists": true}, {"id": "11-software-that-must-not-go-down.md", "title": "11. Software that must not go down", "family": "spine", "summary": "Once people depended on software every hour of every day, it couldn't just be fixed when someone noticed it was broken.", "exists": true}, {"id": "12-machines-that-learn-from-data.md", "title": "12. Machines that learn from data", "family": "spine", "summary": "Some tasks were too fuzzy to write rules for: telling spam from mail, a cat from a dog, a good answer from a bad one.", "exists": true}, {"id": "13-everything-still-exists-at-once.md", "title": "13. Everything still exists at once", "family": "spine", "summary": "Every earlier page told the story of something new replacing something old.", "exists": true}, {"id": "the-model.md", "title": "The model", "family": "reference", "summary": "", "exists": true}, {"id": "forces.md", "title": "Forces", "family": "reference", "summary": "", "exists": true}, {"id": "pushback.md", "title": "Pushback", "family": "reference", "summary": "", "exists": true}, {"id": "ai/prompt-injection.md", "title": "Prompt injection", "family": "ai", "summary": "A language model takes its instructions and its material in the same stream of text.", "exists": true}, {"id": "ai/tokens.md", "title": "Tokens and context windows", "family": "ai", "summary": "A language model doesn't see words or pages.", "exists": true}, {"id": "auth/cloud-iam.md", "title": "Cloud IAM", "family": "auth", "summary": "In a cloud account, anything can be created, read, changed or deleted by anyone holding the right credentials.", "exists": true}, {"id": "auth/code-signing.md", "title": "Code signing", "family": "auth", "summary": "Software travels a long way from the people who wrote it to the machine that runs it: build servers, download sites, mirrors, update systems.", "exists": true}, {"id": "auth/input-validation.md", "title": "Input validation", "family": "auth", "summary": "A system that takes input from outsiders, and also takes instructions from somewhere, will eventually meet an outsider who sends instructions disguised as input.", "exists": true}, {"id": "auth/least-privilege.md", "title": "Least privilege", "family": "auth", "summary": "Granting broad access is convenient: nothing breaks for lack of a permission, and nobody files a request.", "exists": true}, {"id": "auth/multi-tenancy.md", "title": "Multi-tenancy", "family": "auth", "summary": "Running one copy of a system for all customers is far cheaper than running one each, and it's how most software-as-a-service works.", "exists": true}, {"id": "auth/password-storage.md", "title": "Password storage", "family": "auth", "summary": "A system needs to check passwords without being able to reveal them if its database leaks.", "exists": true}, {"id": "auth/sessions-and-tokens.md", "title": "Sessions and tokens", "family": "auth", "summary": "The web forgets you between requests: each one arrives on its own.", "exists": true}, {"id": "auth/tls.md", "title": "TLS", "family": "auth", "summary": "Data crossing a network passes through machines you don't control, and any of them can read it or change it.", "exists": true}, {"id": "cloud/vm-provisioning.md", "title": "VM provisioning", "family": "cloud", "summary": "A rented virtual machine starts as a bare operating system.", "exists": true}, {"id": "cost/cloud-bills.md", "title": "Reading a cloud bill", "family": "cost", "summary": "When computers are rented by the unit, every design choice keeps costing money for as long as it runs.", "exists": true}, {"id": "cost/reliability.md", "title": "The cost of reliability", "family": "cost", "summary": "Users want software that never fails, and leaders promise it.", "exists": true}, {"id": "cost/storage-tiers.md", "title": "Storage tiers", "family": "cost", "summary": "Storage comes in tiers: small and fast and costly, or large and slow and cheap, with several steps between.", "exists": true}, {"id": "data/access-patterns.md", "title": "Access patterns", "family": "data", "summary": "The same data can be stored many ways, and the right one depends entirely on how it will be used: read or written, often or rarely, one item at a time or many together, in what order.", "exists": true}, {"id": "data/consistency.md", "title": "Consistency", "family": "data", "summary": "The moment data exists in two places, a cache, a replica, a browser, a second system, the two copies can disagree.", "exists": true}, {"id": "data/data-gravity.md", "title": "Data gravity", "family": "data", "summary": "Small amounts of data move easily.", "exists": true}, {"id": "data/labels.md", "title": "Labels and training data", "family": "data", "summary": "A model learns to imitate the answers in its training data.", "exists": true}, {"id": "data/migrations.md", "title": "Migrations", "family": "data", "summary": "Data's shape outlives the programs that use it, but it still has to change sometimes: a column split in two, a table moved to a new database, a format replaced.", "exists": true}, {"id": "data/modelling.md", "title": "Data modelling", "family": "data", "summary": "Every system encodes a picture of the world in its data: what an order is, what a person has, how an event relates to a place.", "exists": true}, {"id": "data/pagination.md", "title": "Pagination", "family": "data", "summary": "No screen shows a million items at once, so lists are served in pages.", "exists": true}, {"id": "data/partitioning.md", "title": "Partitioning", "family": "data", "summary": "Copies spread reads, but every copy still holds everything and takes every write.", "exists": true}, {"id": "data/replication.md", "title": "Replication", "family": "data", "summary": "A single database is a single point of failure: when its machine dies, everything stops, and whatever wasn't backed up is gone.", "exists": true}, {"id": "data/serialization.md", "title": "Serialization formats", "family": "data", "summary": "Data inside a program is a web of objects in memory.", "exists": true}, {"id": "dsa/arrays-and-linked-lists.md", "title": "Arrays and linked lists", "family": "dsa", "summary": "A list of things can be kept side by side in memory, in an array, or scattered, with each item pointing to the next, in a linked list.", "exists": true}, {"id": "dsa/b-trees.md", "title": "B-trees", "family": "dsa", "summary": "An index has to find any key among millions quickly, keep keys in order for range queries, and stay fast as keys are added and removed.", "exists": true}, {"id": "dsa/computability.md", "title": "Computability", "family": "dsa", "summary": "It's tempting to ask a tool to check programs for us: will this ever crash, is this malicious, does this loop finish, are these two programs the same?", "exists": true}, {"id": "dsa/graphs.md", "title": "Graphs", "family": "dsa", "summary": "A great deal of what software tracks is really a network: roads between places, machines connected by cables, programs waiting on each other, people following people, commits built on earlier commits.", "exists": true}, {"id": "dsa/hash-tables.md", "title": "Hash tables", "family": "dsa", "summary": "Most programs constantly ask one question: given this key, where's the value?", "exists": true}, {"id": "dsa/hashing.md", "title": "Hashing", "family": "dsa", "summary": "You have a key, such as a freight car number, a password, a file, or a user ID, and you need to do something with it fast: find its record, decide which machine holds it, check it hasn't changed, or prove it's the same as before.", "exists": true}, {"id": "dsa/lsm-trees.md", "title": "LSM trees", "family": "dsa", "summary": "Indexes built as B-trees are good at reading, but each new record means finding its place and updating a page somewhere on disk.", "exists": true}, {"id": "dsa/merkle-dags.md", "title": "Merkle DAGs", "family": "dsa", "summary": "You have two copies of something large, a backup, a database, a project's history, and you need to know whether they're the same, and if not, exactly where they differ.", "exists": true}, {"id": "dsa/queues.md", "title": "Queues", "family": "dsa", "summary": "When work arrives faster than it can be done, it has to wait somewhere, in some order.", "exists": true}, {"id": "dsa/state-machines.md", "title": "State machines", "family": "dsa", "summary": "Most things a program tracks move through stages: an order is placed, paid, shipped, delivered, perhaps cancelled or refunded.", "exists": true}, {"id": "latency/caching.md", "title": "Caching", "family": "latency", "summary": "Some data is expensive to get, because it's far away, slow to compute, or both, and it's asked for far more often than it changes.", "exists": true}, { ne used.", "exists": true}, {"id": "runtimes/type-systems.md", "title": "Type systems", "family": "runtimes", "summary": "In a small program, you remember what shape each piece of data has.", "exists": true}, {"id": "tooling/build-systems.md", "title": "Build systems and package managers", "family": "tooling", "summary": "A large program is built from thousands of files and hundreds of packages, and building all of it from scratch can take an hour.", "exists": true}, {"id": "tooling/ci.md", "title": "CI pipelines", "family": "tooling", "summary": "Continuous integration only works if the build is trusted: when it's red, something is really broken, and when it's green, it's safe to merge.", "exists": true}, {"id": "tooling/coding-agents.md", "title": "Coding agents", "family": "tooling", "summary": "A coding agent can read a codebase, write changes, run tests and try again, all on its own, and it's often genuinely good at it.", "exists": true}, {"id": "tooling/profiling.md", "title": "Profiling", "family": "tooling", "summary": "When something is slow or expensive, everyone has a theory about why, and the theories are usually wrong.", "exists": true}, {"id": "vendors/managed-services.md", "title": "Managed services", "family": "vendors", "summary": "Running your own database, queue or search cluster takes people, time and expertise.", "exists": true}, {"id": "vendors/supply-chain.md", "title": "Software supply chain", "family": "vendors", "summary": "Almost every program is mostly other people's code: libraries, frameworks, tools, and the libraries those depend on.", "exists": true}, {"id": "writing/commit-messages.md", "title": "Commit messages and design records", "family": "writing", "summary": "Code says what a program does.", "exists": true}], "links": [{"source": "00-representations.md", "target": "03-programs-too-big-for-one-head.md"}, {"source": "00-representations.md", "target": "12-machines-that-learn-from-data.md"}, {"source": "00-representations.md", "tar const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
const searchBox = document.getElementById("search");

const nodes = DATA.nodes.map((n, i) => {
  const angle = i * 2.399963;
  const radius = 18 * Math.sqrt(i + 1);
  return { ...n, x: Math.cos(angle) * radius, y: Math.sin(angle) * radius, vx: 0, vy: 0, degree: 0, neighbours: new Set() };
});
const byId = new Map(nodes.map((n) => [n.id, n]));
const links = DATA.links.map((l) => ({ source: byId.get(l.source), target: byId.get(l.target) }));
const trunk = DATA.trunk.map((l) => ({ source: byId.get(l.source), target: byId.get(l.target), trunk: true }));
for (const l of links) {
  l.source.degree++; l.target.degree++;
  l.source.neighbours.add(l.target); l.target.neighbours.add(l.source);
}
for (const n of nodes) {
  n.r = (n.family === "spine" ? 6 : 3.5) + Math.sqrt(n.degree) * 1.3;
  n.color = (DATA.families[n.family] || { color: "#8b949e" }).color;
}

const hiddenFamilies = new Set();
let showTrunk = true, showUnwritten = true, showLabels = true;
let hovered = null, dragged = null, query = "";
let view = { x: 0, y: 0, k: 1 };
let alpha = 1;

function visible(n) {
  return !hiddenFamilies.has(n.family) && (showUnwritten || n.exists);
}

function matches(n) {
  return query && (n.title.toLowerCase().includes(query) || n.id.toLowerCase().includes(query));
}

function tick() {
  const live = nodes.filter(visible);
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      if (d2 > 250000) continue;
      const f = (1400 * alpha) / d2;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }
  const springs = showTrunk ? links.concat(trunk) : links;
  for (const l of springs) {
    const a = l.source, b = l.target;
    if (!visible(a) || !visible(b)) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const rest = l.trunk ? 60 : 80;
    const strength = l.trunk ? 0.25 : 0.5 / Math.min(a.degree || 1, b.degree || 1);
    const f = ((d - rest) / d) * alpha * strength;
    a.vx += dx * f; a.vy += dy * f;
    b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const n of live) {
    n.vx -= n.x * 0.012 * alpha;
    n.vy -= n.y * 0.012 * alpha;
    if (n === dragged) { n.vx = n.vy = 0; continue; }
    n.vx *= 0.6; n.vy *= 0.6;
    n.x += n.vx; n.y += n.vy;
  }
  alpha = Math.max(alpha * 0.985, dragged ? 0.3 : 0);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function toScreen(n) {
  return [n.x * view.k + view.x + innerWidth / 2, n.y * view.k + view.y + innerHeight / 2];
}

function toWorld(sx, sy) {
  return [(sx - innerWidth / 2 - view.x) / view.k, (sy - innerHeight / 2 - view.y) / view.k];
}

function focusSet() {
  if (hovered) return new Set([hovered, ...hovered.neighbours]);
  if (query) return new Set(nodes.filter(matches));
  return null;
}

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const focus = focusSet();
  const dim = (n) => focus && !focus.has(n);

  ctx.lineCap = "round";
  for (const l of links) {
    if (!visible(l.source) || !visible(l.target)) continue;
    const [x1, y1] = toScreen(l.source), [x2, y2] = toScreen(l.target);
    const lit = hovered && (l.source === hovered || l.target === hovered);
    ctx.strokeStyle = lit ? hovered.color : focus ? "rgba(139,148,158,0.06)" : "rgba(139,148,158,0.22)";
    ctx.lineWidth = lit ? 1.6 : 0.8;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  if (showTrunk && !hiddenFamilies.has("spine")) {
    ctx.strokeStyle = focus ? "rgba(230,237,243,0.15)" : "rgba(230,237,243,0.55)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    trunk.forEach((l, i) => {
      const [x1, y1] = toScreen(l.source), [x2, y2] = toScreen(l.target);
      if (i === 0) ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    });
    ctx.stroke();
  }

  for (const n of nodes) {
    if (!visible(n)) continue;
    const [x, y] = toScreen(n);
    const r = n.r * Math.sqrt(view.k);
    ctx.globalAlpha = dim(n) ? 0.15 : 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (n.exists) {
      ctx.fillStyle = n.color; ctx.fill();
    } else {
      ctx.strokeStyle = n.color; ctx.lineWidth = 1.2; ctx.stroke();
    }
    if (n === hovered || matches(n)) {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    if (n.family === "spine") {
      ctx.fillStyle = "#161a1f";
      ctx.font = `600 ${Math.max(8, r * 0.95)}px -apple-system, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(parseInt(n.id, 10)), x, y + 0.5);
    }
  }

  const labelAlpha = showLabels ? Math.min(1, Math.max(0, (view.k - 0.55) * 2.5)) : 0;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const n of nodes) {
    if (!visible(n)) continue;
    const forced = focus ? focus.has(n) : n.family === "spine" || n.family === "reference";
    const a = forced ? 1 : dim(n) ? 0 : labelAlpha;
    if (a <= 0.02) continue;
    const [x, y] = toScreen(n);
    const r = n.r * Math.sqrt(view.k);
    const label = n.family === "spine" ? n.title.replace(/^\d+\.\s*/, "") : n.title;
    ctx.globalAlpha = a;
    ctx.font = `${n === hovered ? 600 : 400} 12px -apple-system, sans-serif`;
    ctx.fillStyle = n.exists ? "#e6edf3" : "#8b949e";
    ctx.fillText(label, x, y + r + 4);
  }
  ctx.globalAlpha = 1;
}

function frame() {
  if (alpha > 0.002) tick();
  draw();
  requestAnimationFrame(frame);
}

function nodeAt(sx, sy) {
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    if (!visible(n)) continue;
    const [x, y] = toScreen(n);
    const d = Math.hypot(sx - x, sy - y);
    const r = n.r * Math.sqrt(view.k) + 4;
    if (d < r && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

function showTip(n, sx, sy) {
  if (!n) { tip.style.display = "none"; return; }
  const links = n.degree === 1 ? "1 link" : `${n.degree} links`;
  const action = n.exists ? "Click to open" : "Not written yet: a branch nobody has started";
  tip.innerHTML = "";
  const b = document.createElement("b"); b.textContent = n.title;
  const code = document.createElement("code"); code.textContent = `${n.id} · ${links}`;
  tip.append(b, code);
  if (n.exists && n.summary) {
    const s = document.createElement("span"); s.textContent = n.summary; tip.append(s);
  }
  const em = document.createElement("em"); em.textContent = action; tip.append(em);
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(sx + 16, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(sy + 16, innerHeight - h - 8) + "px";
}

function open(n) {
  if (!n.exists) return;
  const onPages = location.hostname.endsWith("github.io");
  const url = onPages ? n.id.replace(/\.md$/, ".html") : (DATA.base || "") + n.id;
  window.open(url, "_blank", "noopener");
}

let pointer = null;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  const n = nodeAt(e.clientX, e.clientY);
  pointer = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, node: n, moved: false };
  if (n) { dragged = n; alpha = Math.max(alpha, 0.3); }
  canvas.classList.add("dragging");
});

canvas.addEventListener("pointermove", (e) => {
  if (pointer) {
    const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
    if (Math.hypot(dx, dy) > 4) pointer.moved = true;
    if (pointer.node) {
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      pointer.node.x = wx; pointer.node.y = wy;
      alpha = Math.max(alpha, 0.3);
    } else {
      view.x = pointer.vx + dx; view.y = pointer.vy + dy;
    }
    if (pointer.moved) showTip(null);
    return;
  }
  hovered = nodeAt(e.clientX, e.clientY);
  canvas.classList.toggle("over-node", !!hovered);
  showTip(hovered, e.clientX, e.clientY);
});

canvas.addEventListener("pointerup", () => {
  if (pointer && pointer.node && !pointer.moved) open(pointer.node);
  pointer = null; dragged = null;
  canvas.classList.remove("dragging");
});

canvas.addEventListener("pointerleave", () => {
  if (!pointer) { hovered = null; showTip(null); }
});

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  const k = Math.min(6, Math.max(0.2, view.k * factor));
  const sx = e.clientX - innerWidth / 2, sy = e.clientY - innerHeight / 2;
  view.x = sx - ((sx - view.x) * k) / view.k;
  view.y = sy - ((sy - view.y) * k) / view.k;
  view.k = k;
}, { passive: false });

searchBox.addEventListener("input", () => { query = searchBox.value.trim().toLowerCase(); });
searchBox.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const n = nodes.find((m) => visible(m) && matches(m));
  if (!n) return;
  view.k = Math.max(view.k, 1.6);
  view.x = -n.x * view.k; view.y = -n.y * view.k;
});

const legend = document.getElementById("legend");
const present = new Set(nodes.map((n) => n.family));
for (const [key, fam] of Object.entries(DATA.families)) {
  if (!present.has(key)) continue;
  const chip = document.createElement("button");
  chip.className = "chip"; chip.type = "button";
  const dot = document.createElement("i"); dot.style.background = fam.color;
  chip.append(dot, document.createTextNode(fam.label));
  chip.addEventListener("click", () => {
    hiddenFamilies.has(key) ? hiddenFamilies.delete(key) : hiddenFamilies.add(key);
    chip.classList.toggle("off", hiddenFamilies.has(key));
    alpha = Math.max(alpha, 0.5);
  });
  legend.append(chip);
}

document.getElementById("show-trunk").addEventListener("change", (e) => { showTrunk = e.target.checked; alpha = Math.max(alpha, 0.5); });
document.getElementById("show-unwritten").addEventListener("change", (e) => { showUnwritten = e.target.checked; alpha = Math.max(alpha, 0.5); });
document.getElementById("show-labels").addEventListener("change", (e) => { showLabels = e.target.checked; });

addEventListener("resize", resize);
resize();
for (let i = 0; i < 300; i++) tick();
alpha = 0.3;
const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) || 1;
view.k = Math.min(1.4, (Math.min(innerWidth, innerHeight) * 0.9) / span);
frame();
</script>
