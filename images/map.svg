<circle cx="737.0" cy="438" r="5" fill="#8a5cd6"/>
<circle cx="570.0" cy="360" r="15" fill="#ffffff" stroke="#1f2328" stroke-width="4"/>
<text x="570.0" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">10</text>
<text x="570.0" y="400" font-size="13" text-anchor="middle" fill="#1f2328">Many people,</text>
<text x="570.0" y="417" font-size="13" text-anchor="middle" fill="#1f2328">one codebase</text>
<circle cx="563.0" cy="438" r="5" fill="#1baa7a"/>
<circle cx="577.0" cy="438" r="5" fill="#d64a4a"/>
<circle cx="410.0" cy="360" r="15" fill="#ffffff" stroke="#1f2328" stroke-width="4"/>
<text x="410.0" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">11</text>
<text x="410.0" y="400" font-size="13" text-anchor="middle" fill="#1f2328">Software that must</text>
<text x="410.0" y="417" font-size="13" text-anchor="middle" fill="#1f2328">not go down</text>
<circle cx="403.0" cy="438" r="5" fill="#e09a1a"/>
<circle cx="417.0" cy="438" r="5" fill="#8a5cd6"/>
<circle cx="250.0" cy="360" r="15" fill="#ffffff" stroke="#1f2328" stroke-width="4"/>
<text x="250.0" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">12</text>
<text x="250.0" y="400" font-size="13" text-anchor="middle" fill="#1f2328">Machines that learn</text>
<text x="250.0" y="417" font-size="13" text-anchor="middle" fill="#1f2328">from data</text>
