<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">A nearest-first route, and the same route with its crossings removed</title>
<desc id="d">Two delivery routes through the same twelve stops. Left: the nearest-stop route, efficient at first and then crossing back over itself with long final legs. Right: the same route after removing every crossing, shorter, with no legs crossing.</desc>

