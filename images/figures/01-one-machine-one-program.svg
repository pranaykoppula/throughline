<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Walking a grid by column or by row</title>
<desc id="d">A grid stored row by row, each row on its own page of memory. Walking down a column touches a different page at every step; walking along a row stays on one page until it ends.</desc>

