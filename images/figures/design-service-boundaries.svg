<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Cut along the nouns, or along the changes</title>
<desc id="d">Two diagrams of the same quoting system. Before: fourteen services named after nouns, with nine of them highlighted because adding pet insurance changed each one, and about thirty calls for a single quote. After: three product modules inside one program, plus three separate services for payments, documents and identity; adding pet insurance changes one module, and a quote makes four calls.</desc>

