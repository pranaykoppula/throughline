<line x1="679" y1="256" x2="380" y2="300" class="s-accent" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="270" y="300" width="220" height="44" rx="6" class="f-soft-ok" />
<rect x="270" y="300" width="220" height="44" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="380" y="320" class="t" font-size="13" text-anchor="middle" font-weight="600">parts catalogue</text>
<text x="380" y="335" class="tm" font-size="11" text-anchor="middle" font-weight="normal">the only code that knows the format</text>
<text x="500" y="330" class="t" font-size="12.5" text-anchor="start" font-weight="normal">A later change: one module, two weeks.</text>
