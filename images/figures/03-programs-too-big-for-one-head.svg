<line x1="95" y1="256" x2="380" y2="300" class="s-accent" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="176" y="212" width="130" height="44" rx="6" class="f-faint" />
<rect x="176" y="212" width="130" height="44" rx="6" class="s-line" fill="none" stroke-width="1"/>
