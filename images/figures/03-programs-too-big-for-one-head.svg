<rect x="322" y="58" width="130" height="52" rx="6" class="f-soft-warn" />
<rect x="322" y="58" width="130" height="52" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="387" y="82" class="t" font-size="13" text-anchor="middle" font-weight="600">look up parts</text>
<text x="387" y="97" class="tm" font-size="11" text-anchor="middle" font-weight="normal">knows the format</text>
<line x1="452" y1="84" x2="468" y2="84" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="468" y="58" width="130" height="52" rx="6" class="f-soft-warn" />
<rect x="468" y="58" width="130" height="52" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="533" y="82" class="t" font-size="13" text-anchor="middle" font-weight="600">price</text>
<text x="533" y="97" class="tm" font-size="11" text-anchor="middle" font-weight="normal">knows the format</text>
<line x1="598" y1="84" x2="614" y2="84" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="614" y="58" width="130" height="52" rx="6" class="f-soft-warn" />
<rect x="614" y="58" width="130" height="52" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="679" y="82" class="t" font-size="13" text-anchor="middle" font-weight="600">print lists</text>
<text x="679" y="97" class="tm" font-size="11" text-anchor="middle" font-weight="normal">knows the format</text>
<text x="30" y="134" class="t" font-size="12.5" text-anchor="start" font-weight="normal">Part numbers change from six digits to nine characters: all five change, over three months.</text>
<text x="30" y="184" class="t" font-size="15" text-anchor="start" font-weight="600">Divided by decision</text>
<text x="30" y="203" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">One module hides the format; the others only ask it questions</text>
<rect x="30" y="212" width="130" height="44" rx="6" class="f-faint" />
<rect x="30" y="212" width="130" height="44" rx="6" class="s-line" fill="none" stroke-width="1"/>
