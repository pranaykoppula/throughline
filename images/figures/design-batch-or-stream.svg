<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<title id="t">Too late, and out of order</title>
<desc id="d">Two panels. Top: a night's fraudulent purchases on copied cards, accumulating from evening until the two o'clock batch run blocks the cards; with stream scoring, each card is blocked after its first few purchases. Bottom: a bus's card reader, offline for six hours, sends fifteen fares at once when it reconnects; counted by arrival time they look like fifteen purchases in a moment, counted by when they happened they're spread across the day.</desc>

