<text x="740" y="194" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">the processor is almost never idle</text>
<text x="30" y="230" class="t" font-size="15" text-anchor="start" font-weight="600">The circle</text>
<text x="30" y="249" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Black: holds a drive. Red: waits for a drive</text>
<rect x="110" y="270" width="120" height="46" rx="6" class="f-soft-amber" />
<rect x="110" y="270" width="120" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="170" y="297.3" class="t" font-size="13" text-anchor="middle" font-weight="600">job 1</text>
<rect x="110" y="360" width="120" height="46" rx="6" class="f-soft-amber" />
<rect x="110" y="360" width="120" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="170" y="387.3" class="t" font-size="13" text-anchor="middle" font-weight="600">job 2</text>
<rect x="330" y="270" width="120" height="46" rx="6" class="f-faint" />
<rect x="330" y="270" width="120" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="390" y="297.3" class="t" font-size="13" text-anchor="middle" font-weight="600">tape drive 1</text>
<rect x="330" y="360" width="120" height="46" rx="6" class="f-faint" />
<rect x="330" y="360" width="120" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="390" y="387.3" class="t" font-size="13" text-anchor="middle" font-weight="600">tape drive 2</text>
<line x1="330" y1="293" x2="232" y2="293" class="s-ink" stroke-width="1.6" fill="none" marker-end="url(#arrow-ink)"/>
<line x1="330" y1="383" x2="232" y2="383" class="s-ink" stroke-width="1.6" fill="none" marker-end="url(#arrow-ink)"/>
<line x1="230" y1="305" x2="330" y2="372" class="s-warn" stroke-width="1.8" fill="none" marker-end="url(#arrow-warn)"/>
<line x1="230" y1="372" x2="330" y2="305" class="s-warn" stroke-width="1.8" fill="none" marker-end="url(#arrow-warn)"/>
<text x="500" y="290" class="t" font-size="15" text-anchor="start" font-weight="600">The rule that breaks it</text>
<text x="500" y="314" class="t" font-size="12.5" text-anchor="start" font-weight="normal">Ask for drives in number order,</text>
<text x="500" y="332" class="t" font-size="12.5" text-anchor="start" font-weight="normal">lowest first. Nobody holding drive 2</text>
<text x="500" y="350" class="t" font-size="12.5" text-anchor="start" font-weight="normal">can be waiting for drive 1, so the</text>
<text x="500" y="368" class="t" font-size="12.5" text-anchor="start" font-weight="normal">circle can't close.</text>
</svg>
