<rect width="760" height="430" class="bg"/>
<text x="30" y="30" class="t" font-size="15" text-anchor="start" font-weight="600">Filling the waiting</text>
<text x="30" y="49" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Processor time, left to right: busy (blue) and waiting on a device (grey)</text>
<text x="130" y="79" class="t" font-size="12" text-anchor="end" font-weight="normal">one job</text>
<rect x="140" y="64" width="21" height="22" rx="3" class="f-accent" />
<rect x="163" y="64" width="90" height="22" rx="3" class="f-line" />
<rect x="255" y="64" width="21" height="22" rx="3" class="f-accent" />
<rect x="278" y="64" width="90" height="22" rx="3" class="f-line" />
