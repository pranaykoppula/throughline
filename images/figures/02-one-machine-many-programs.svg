<rect x="577" y="130" width="21" height="22" rx="3" class="f-accent" />
<rect x="600" y="130" width="44" height="22" rx="3" class="f-line" />
<text x="130" y="171" class="t" font-size="12" text-anchor="end" font-weight="normal">job C</text>
<rect x="140" y="156" width="46" height="22" rx="3" class="f-faint" />
<rect x="186" y="156" width="21" height="22" rx="3" class="f-accent" />
<rect x="209" y="156" width="44" height="22" rx="3" class="f-line" />
