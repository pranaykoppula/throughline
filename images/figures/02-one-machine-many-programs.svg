<rect x="416" y="156" width="44" height="22" rx="3" class="f-line" />
<rect x="462" y="156" width="21" height="22" rx="3" class="f-accent" />
<rect x="485" y="156" width="44" height="22" rx="3" class="f-line" />
<rect x="531" y="156" width="21" height="22" rx="3" class="f-accent" />
