<rect x="600" y="64" width="21" height="22" rx="3" class="f-accent" />
<rect x="623" y="64" width="90" height="22" rx="3" class="f-line" />
<text x="715" y="58" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">busy 1 in 5</text>
<text x="130" y="119" class="t" font-size="12" text-anchor="end" font-weight="normal">job A</text>
<rect x="140" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="163" y="104" width="44" height="22" rx="3" class="f-line" />
<rect x="209" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="232" y="104" width="44" height="22" rx="3" class="f-line" />
<rect x="278" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="301" y="104" width="44" height="22" rx="3" class="f-line" />
<rect x="347" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="370" y="104" width="44" height="22" rx="3" class="f-line" />
<rect x="416" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="439" y="104" width="44" height="22" rx="3" class="f-line" />
<rect x="485" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="508" y="104" width="44" height="22" rx="3" class="f-line" />
<rect x="554" y="104" width="21" height="22" rx="3" class="f-accent" />
<rect x="577" y="104" width="44" height="22" rx="3" class="f-line" />
<text x="130" y="145" class="t" font-size="12" text-anchor="end" font-weight="normal">job B</text>
<rect x="140" y="130" width="23" height="22" rx="3" class="f-faint" />
<rect x="163" y="130" width="21" height="22" rx="3" class="f-accent" />
<rect x="186" y="130" width="44" height="22" rx="3" class="f-line" />
