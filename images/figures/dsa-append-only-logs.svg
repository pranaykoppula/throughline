<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">A balance, and a ledger</title>
<desc id="d">Two ways to store a wallet. Left: one balance per account, overwritten by each change, with a corrupted value and no way back. Right: a ledger of entries, each written once, with a duplicate bonus corrected by a reversing entry, and the balance worked out as the sum of the entries.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="360" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Overwrite the balance</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Each change replaces the last</text>
<rect x="30" y="70" width="300" height="30" rx="4" class="f-faint" />
<text x="42" y="90" class="tm" font-size="12" text-anchor="start" font-weight="normal">top-up</text>
<text x="318" y="90" class="t" font-size="12" text-anchor="end" font-weight="normal">balance: 500</text>
<line x1="320" y1="100" x2="320" y2="110" class="s-line" stroke-width="1" fill="none"/>
<rect x="30" y="110" width="300" height="30" rx="4" class="f-faint" />
<text x="42" y="130" class="tm" font-size="12" text-anchor="start" font-weight="normal">payment</text>
<text x="318" y="130" class="t" font-size="12" text-anchor="end" font-weight="normal">balance: 380</text>
<line x1="320" y1="140" x2="320" y2="150" class="s-line" stroke-width="1" fill="none"/>
<rect x="30" y="150" width="300" height="30" rx="4" class="f-faint" />
<text x="42" y="170" class="tm" font-size="12" text-anchor="start" font-weight="normal">bonus</text>
<text x="318" y="170" class="t" font-size="12" text-anchor="end" font-weight="normal">balance: 430</text>
<line x1="320" y1="180" x2="320" y2="190" class="s-line" stroke-width="1" fill="none"/>
<rect x="30" y="190" width="300" height="30" rx="4" class="f-faint" />
<text x="42" y="210" class="tm" font-size="12" text-anchor="start" font-weight="normal">bonus again (bug)</text>
<text x="318" y="210" class="t" font-size="12" text-anchor="end" font-weight="normal">balance: 480</text>
<line x1="320" y1="220" x2="320" y2="230" class="s-line" stroke-width="1" fill="none"/>
<rect x="30" y="230" width="300" height="30" rx="4" class="f-soft-warn" />
<text x="42" y="250" class="t" font-size="12" text-anchor="start" font-weight="normal">corrupted write</text>
<text x="318" y="250" class="t" font-size="12" text-anchor="end" font-weight="600">balance: 9,104</text>
<text x="30" y="290" class="t" font-size="12" text-anchor="start" font-weight="normal">Only the last row exists. The earlier ones are gone,</text>
<text x="30" y="308" class="t" font-size="12" text-anchor="start" font-weight="normal">so nobody can say what the balance should be.</text>
<text x="400" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Append to a ledger</text>
<text x="400" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Each entry written once; the balance is their sum</text>
<rect x="400" y="70" width="330" height="30" rx="4" class="f-faint" />
<text x="412" y="90" class="t" font-size="12" text-anchor="start" font-weight="normal">top-up</text>
<text x="718" y="90" class="t" font-size="12" text-anchor="end" font-weight="600">+500</text>
<rect x="400" y="110" width="330" height="30" rx="4" class="f-faint" />
<text x="412" y="130" class="t" font-size="12" text-anchor="start" font-weight="normal">payment</text>
<text x="718" y="130" class="t" font-size="12" text-anchor="end" font-weight="600">−120</text>
<rect x="400" y="150" width="330" height="30" rx="4" class="f-faint" />
<text x="412" y="170" class="t" font-size="12" text-anchor="start" font-weight="normal">bonus</text>
<text x="718" y="170" class="t" font-size="12" text-anchor="end" font-weight="600">+50</text>
<rect x="400" y="190" width="330" height="30" rx="4" class="f-soft-amber" />
<text x="412" y="210" class="t" font-size="12" text-anchor="start" font-weight="normal">bonus again (bug)</text>
<text x="718" y="210" class="t" font-size="12" text-anchor="end" font-weight="600">+50</text>
<rect x="400" y="230" width="330" height="30" rx="4" class="f-soft-ok" />
<text x="412" y="250" class="t" font-size="12" text-anchor="start" font-weight="normal">reversal of the duplicate</text>
<text x="718" y="250" class="t" font-size="12" text-anchor="end" font-weight="600">−50</text>
<text x="400" y="290" class="t" font-size="12" text-anchor="start" font-weight="600">Balance: 500 − 120 + 50 + 50 − 50 = 430,</text>
<text x="400" y="308" class="t" font-size="12" text-anchor="start" font-weight="normal">and every step of how it got there.</text>
<text x="30" y="345" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Pesos; illustrative entries.</text>
</svg>
