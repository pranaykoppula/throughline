<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Finding one bad commit among 400 by halving</title>
<desc id="d">A row of 400 commits. Each of nine steps tests the middle of the commits still in doubt and rules out half of them, until one commit is left.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="400" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Nine builds instead of four hundred</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Each test of the middle commit rules out half of what's left</text>
<text x="110" y="86" class="t" font-size="11.5" text-anchor="end" font-weight="normal">start</text>
<rect x="120" y="72" width="560" height="18" rx="3" class="f-faint" />
<rect x="120" y="72" width="560" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="86" class="tm" font-size="11" text-anchor="start" font-weight="normal">400 left</text>
<line x1="400" y1="94" x2="400" y2="102" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="116" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 1</text>
<rect x="120" y="102" width="560" height="18" rx="3" class="f-faint" />
<rect x="400" y="102" width="280" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="116" class="tm" font-size="11" text-anchor="start" font-weight="normal">200 left</text>
<line x1="540" y1="124" x2="540" y2="132" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="146" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 2</text>
<rect x="120" y="132" width="560" height="18" rx="3" class="f-faint" />
<rect x="400" y="132" width="140" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="146" class="tm" font-size="11" text-anchor="start" font-weight="normal">100 left</text>
<line x1="470" y1="154" x2="470" y2="162" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="176" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 3</text>
<rect x="120" y="162" width="560" height="18" rx="3" class="f-faint" />
<rect x="470" y="162" width="70" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="176" class="tm" font-size="11" text-anchor="start" font-weight="normal">50 left</text>
<line x1="505" y1="184" x2="505" y2="192" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="206" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 4</text>
<rect x="120" y="192" width="560" height="18" rx="3" class="f-faint" />
<rect x="505" y="192" width="35" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="206" class="tm" font-size="11" text-anchor="start" font-weight="normal">25 left</text>
<line x1="521.8" y1="214" x2="521.8" y2="222" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="236" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 5</text>
<rect x="120" y="222" width="560" height="18" rx="3" class="f-faint" />
<rect x="505" y="222" width="16.8" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="236" class="tm" font-size="11" text-anchor="start" font-weight="normal">12 left</text>
<line x1="513.4" y1="244" x2="513.4" y2="252" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="266" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 6</text>
<rect x="120" y="252" width="560" height="18" rx="3" class="f-faint" />
<rect x="505" y="252" width="8.4" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="266" class="tm" font-size="11" text-anchor="start" font-weight="normal">6 left</text>
<line x1="509.2" y1="274" x2="509.2" y2="282" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="296" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 7</text>
<rect x="120" y="282" width="560" height="18" rx="3" class="f-faint" />
<rect x="509.2" y="282" width="4.2" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="296" class="tm" font-size="11" text-anchor="start" font-weight="normal">3 left</text>
<line x1="510.6" y1="304" x2="510.6" y2="312" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="326" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 8</text>
<rect x="120" y="312" width="560" height="18" rx="3" class="f-faint" />
<rect x="510.6" y="312" width="2.8" height="18" rx="3" class="f-soft-amber" />
<text x="688" y="326" class="tm" font-size="11" text-anchor="start" font-weight="normal">2 left</text>
<line x1="512" y1="334" x2="512" y2="342" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="110" y="356" class="t" font-size="11.5" text-anchor="end" font-weight="normal">test 9</text>
<rect x="120" y="342" width="560" height="18" rx="3" class="f-faint" />
<rect x="512" y="342" width="2" height="18" rx="3" class="f-warn" />
<text x="688" y="356" class="tm" font-size="11" text-anchor="start" font-weight="normal">1 left</text>
<text x="30" y="392" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Commit positions are illustrative. 400 commits always take at most 9 tests, because 2⁹ = 512.</text>
</svg>
