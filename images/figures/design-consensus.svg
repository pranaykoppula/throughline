<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">The leader that slept through its lease</title>
<desc id="d">A timeline with two schedulers and the database. Scheduler A holds lease 7 and writes. It freezes for forty-five seconds; its lease runs out; scheduler B is granted lease 8 and writes. A wakes, still believing it leads, and tries to write with lease 7. The database, which has already seen 8, rejects the write.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="330" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Two schedulers, one database, numbered leases</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">The database keeps the highest lease number it has seen</text>
<text x="30" y="94" class="t" font-size="12.5" text-anchor="start" font-weight="600">scheduler A</text>
<line x1="130" y1="90" x2="730" y2="90" class="s-line" stroke-width="1.2" fill="none"/>
<text x="30" y="164" class="t" font-size="12.5" text-anchor="start" font-weight="600">scheduler B</text>
<line x1="130" y1="160" x2="730" y2="160" class="s-line" stroke-width="1.2" fill="none"/>
<text x="30" y="234" class="t" font-size="12.5" text-anchor="start" font-weight="600">database</text>
<line x1="130" y1="230" x2="730" y2="230" class="s-line" stroke-width="1.2" fill="none"/>
<rect x="140" y="78" width="90" height="24" rx="4" class="f-soft-accent" />
<text x="185" y="94" class="t" font-size="11.5" text-anchor="middle" font-weight="600">lease 7</text>
<line x1="200" y1="102" x2="220" y2="224" class="s-accent" stroke-width="1.6" fill="none" marker-end="url(#arrow-accent)"/>
<text x="228" y="212" class="tm" font-size="11" text-anchor="start" font-weight="normal">write (7): ok</text>
<rect x="240" y="78" width="250" height="24" rx="4" class="f-faint" />
<rect x="240" y="78" width="250" height="24" rx="4" class="s-line" fill="none" stroke-width="1" stroke-dasharray="4 3"/>
<text x="365" y="94" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">frozen for 45 seconds</text>
<text x="330" y="70" class="tm" font-size="11" text-anchor="middle" font-weight="normal">lease 7 runs out</text>
<rect x="340" y="148" width="90" height="24" rx="4" class="f-soft-ok" />
<text x="385" y="164" class="t" font-size="11.5" text-anchor="middle" font-weight="600">lease 8</text>
<line x1="400" y1="172" x2="420" y2="224" class="s-ok" stroke-width="1.6" fill="none" marker-end="url(#arrow-ok)"/>
<text x="426" y="212" class="tm" font-size="11" text-anchor="start" font-weight="normal">write (8): ok</text>
<text x="560" y="70" class="tm" font-size="11" text-anchor="middle" font-weight="normal">wakes, still sure it leads</text>
<line x1="560" y1="102" x2="590" y2="224" class="s-warn" stroke-width="1.6" fill="none" marker-end="url(#arrow-warn)"/>
<text x="598" y="212" class="tm" font-size="11" text-anchor="start" font-weight="normal">write (7)</text>
<rect x="560" y="238" width="160" height="24" rx="4" class="f-soft-warn" />
<text x="640" y="254" class="t" font-size="11.5" text-anchor="middle" font-weight="600">rejected: 8 already seen</text>
<text x="30" y="296" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Ilinca's invoice run. The pause and the lease numbers are from the story; the spacing is not to scale.</text>
</svg>
