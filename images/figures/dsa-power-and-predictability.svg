<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Two engines, one pattern, one line that almost matches</title>
<desc id="d">A line chart on a logarithmic time scale. As the line of text that almost matches gets longer, a backtracking engine's time doubles with every extra character, from microseconds to more than ten minutes at thirty characters. A linear-time engine's time grows in step with the length and stays in microseconds. A dashed line marks a ten-millisecond time budget per message.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="360" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Time to give up on one line</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">A repetition inside a repetition, against text that fails only at the end</text>
<line x1="100" y1="273.7" x2="700" y2="273.7" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="277.7" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1 µs</text>
<line x1="100" y1="210.5" x2="700" y2="210.5" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="214.5" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1 ms</text>
<line x1="100" y1="147.4" x2="700" y2="147.4" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="151.4" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1 s</text>
<line x1="100" y1="109.9" x2="700" y2="109.9" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="113.9" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1 min</text>
<line x1="100" y1="84.2" x2="700" y2="84.2" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="88.2" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">17 min</text>
<text x="100" y="297" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">0</text>
<text x="293.5" y="297" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">10</text>
<text x="487.1" y="297" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">20</text>
<text x="680.6" y="297" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">30</text>
<line x1="100" y1="280" x2="700" y2="280" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="400" y="316" class="tm" font-size="12" text-anchor="middle" font-weight="normal">characters in the line that almost matches</text>
<text x="54" y="68" class="tm" font-size="12" text-anchor="start" font-weight="normal">time</text>
<path d="M 100 273.7 L 119.4 267.3 L 138.7 261 L 158.1 254.7 L 177.4 248.3 L 196.8 242 L 216.1 235.7 L 235.5 229.3 L 254.8 223 L 274.2 216.6 L 293.5 210.3 L 312.9 204 L 332.3 197.6 L 351.6 191.3 L 371 185 L 390.3 178.6 L 409.7 172.3 L 429 165.9 L 448.4 159.6 L 467.7 153.3 L 487.1 146.9 L 506.5 140.6 L 525.8 134.3 L 545.2 127.9 L 564.5 121.6 L 583.9 115.2 L 603.2 108.9 L 622.6 102.6 L 641.9 96.2 L 661.3 89.9 L 680.6 83.6" class="s-warn" stroke-width="2.5" fill="none" />
<path d="M 100 273.7 L 119.4 273.7 L 138.7 267.3 L 158.1 263.6 L 177.4 261 L 196.8 259 L 216.1 257.3 L 235.5 255.9 L 254.8 254.7 L 274.2 253.6 L 293.5 252.6 L 312.9 251.8 L 332.3 251 L 351.6 250.2 L 371 249.6 L 390.3 248.9 L 409.7 248.3 L 429 247.8 L 448.4 247.3 L 467.7 246.8 L 487.1 246.3 L 506.5 245.8 L 525.8 245.4 L 545.2 245 L 564.5 244.6 L 583.9 244.3 L 603.2 243.9 L 622.6 243.6 L 641.9 243.2 L 661.3 242.9 L 680.6 242.6" class="s-ok" stroke-width="2.5" fill="none" />
<line x1="100" y1="189.5" x2="700" y2="189.5" class="s-amber" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
<text x="104" y="183.5" class="tm" font-size="11" text-anchor="start" font-weight="normal">a 10 ms budget per message</text>
<text x="119.4" y="113.7" class="t" font-size="12" text-anchor="start" font-weight="600">backtracking: doubles with every character</text>
<text x="674.6" y="235.8" class="t" font-size="12" text-anchor="end" font-weight="600">one pass: grows with the length</text>
<text x="30" y="346" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Illustrative timings: a microsecond per step. Real engines differ in speed, not in shape.</text>
</svg>
