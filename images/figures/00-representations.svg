<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Truncating instead of rounding</title>
<desc id="d">Two lines over 22 months from an index value of 1000. With each recalculation rounded, the index ends near 1098. With each recalculation cut off at three decimal places, the same trades end near 520.</desc>

