<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">An inverted index</title>
<desc id="d">An inverted index. Three short articles on the left. In the middle, a table from each word to the articles containing it, in order. On the right, a two-word search fetching two lists and keeping only the articles in both.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="420" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Articles</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Headlines stand in for the text</text>
<rect x="30" y="66" width="210" height="40" rx="5" class="f-faint" />
<text x="40" y="82" class="tm" font-size="11" text-anchor="start" font-weight="normal">article 1</text>
<text x="40" y="98" class="t" font-size="11.5" text-anchor="start" font-weight="normal">flood closes Kirkstall bypass</text>
<rect x="30" y="118" width="210" height="40" rx="5" class="f-faint" />
<text x="40" y="134" class="tm" font-size="11" text-anchor="start" font-weight="normal">article 2</text>
<text x="40" y="150" class="t" font-size="11.5" text-anchor="start" font-weight="normal">council debates flood defences</text>
<rect x="30" y="170" width="210" height="40" rx="5" class="f-faint" />
<text x="40" y="186" class="tm" font-size="11" text-anchor="start" font-weight="normal">article 3</text>
<text x="40" y="202" class="t" font-size="11.5" text-anchor="start" font-weight="normal">bypass vote delayed again</text>
<text x="270" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Inverted index</text>
<text x="270" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Word: the articles containing it</text>
<rect x="270" y="66" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="80" class="t" font-size="11.5" text-anchor="start" font-weight="normal">again</text>
<text x="480" y="80" class="t" font-size="11.5" text-anchor="end" font-weight="normal">3</text>
<rect x="270" y="90" width="220" height="20" rx="3" class="f-soft-accent" />
<text x="280" y="104" class="t" font-size="11.5" text-anchor="start" font-weight="600">bypass</text>
<text x="480" y="104" class="t" font-size="11.5" text-anchor="end" font-weight="normal">1, 3</text>
<rect x="270" y="114" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="128" class="t" font-size="11.5" text-anchor="start" font-weight="normal">closes</text>
<text x="480" y="128" class="t" font-size="11.5" text-anchor="end" font-weight="normal">1</text>
<rect x="270" y="138" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="152" class="t" font-size="11.5" text-anchor="start" font-weight="normal">council</text>
<text x="480" y="152" class="t" font-size="11.5" text-anchor="end" font-weight="normal">2</text>
<rect x="270" y="162" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="176" class="t" font-size="11.5" text-anchor="start" font-weight="normal">debates</text>
<text x="480" y="176" class="t" font-size="11.5" text-anchor="end" font-weight="normal">2</text>
<rect x="270" y="186" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="200" class="t" font-size="11.5" text-anchor="start" font-weight="normal">defences</text>
<text x="480" y="200" class="t" font-size="11.5" text-anchor="end" font-weight="normal">2</text>
<rect x="270" y="210" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="224" class="t" font-size="11.5" text-anchor="start" font-weight="normal">delayed</text>
<text x="480" y="224" class="t" font-size="11.5" text-anchor="end" font-weight="normal">3</text>
<rect x="270" y="234" width="220" height="20" rx="3" class="f-soft-accent" />
<text x="280" y="248" class="t" font-size="11.5" text-anchor="start" font-weight="600">flood</text>
<text x="480" y="248" class="t" font-size="11.5" text-anchor="end" font-weight="normal">1, 2</text>
<rect x="270" y="258" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="272" class="t" font-size="11.5" text-anchor="start" font-weight="normal">kirkstall</text>
<text x="480" y="272" class="t" font-size="11.5" text-anchor="end" font-weight="normal">1</text>
<rect x="270" y="282" width="220" height="20" rx="3" class="f-faint" />
<text x="280" y="296" class="t" font-size="11.5" text-anchor="start" font-weight="normal">vote</text>
<text x="480" y="296" class="t" font-size="11.5" text-anchor="end" font-weight="normal">3</text>
<text x="520" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Search: flood bypass</text>
<text x="520" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Walk both lists together</text>
<text x="520" y="90" class="t" font-size="12.5" text-anchor="start" font-weight="normal">flood:   1, 2</text>
<text x="520" y="112" class="t" font-size="12.5" text-anchor="start" font-weight="normal">bypass: 1, 3</text>
<rect x="520" y="130" width="210" height="34" rx="5" class="f-soft-ok" />
<text x="530" y="152" class="t" font-size="12.5" text-anchor="start" font-weight="600">in both: article 1</text>
<text x="520" y="196" class="t" font-size="12" text-anchor="start" font-weight="normal">Then rank: rare words such as</text>
<text x="520" y="214" class="t" font-size="12" text-anchor="start" font-weight="normal">"Kirkstall" count for more than</text>
<text x="520" y="232" class="t" font-size="12" text-anchor="start" font-weight="normal">common ones such as "flood".</text>
</svg>
