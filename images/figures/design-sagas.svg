<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d">
<title id="t">Each step, and its way back</title>
<desc id="d">Three steps of an order, left to right: reserve stock, hold a delivery slot, charge the card. Under each, an arrow down to its compensating step: release stock, release the slot, refund. The first two are cheap and invisible to the customer; the refund takes days and appears on their statement, which is why the charge comes last.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="320" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">An order as a saga</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Forward steps on top; the compensation for each underneath</text>
<rect x="60" y="80" width="170" height="46" rx="6" class="f-soft-ok" />
<rect x="60" y="80" width="170" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="145" y="107.3" class="t" font-size="13" text-anchor="middle" font-weight="600">reserve stock</text>
<rect x="60" y="200" width="170" height="46" rx="6" class="f-faint" />
<rect x="60" y="200" width="170" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="145" y="227.3" class="t" font-size="13" text-anchor="middle" font-weight="600">release stock</text>
<line x1="145" y1="128" x2="145" y2="196" class="s-ink" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-ink)"/>
<text x="145" y="266" class="tm" font-size="11" text-anchor="middle" font-weight="normal">cheap, invisible</text>
<line x1="232" y1="103" x2="286" y2="103" class="s-ink" stroke-width="1.6" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="290" y="80" width="170" height="46" rx="6" class="f-soft-ok" />
<rect x="290" y="80" width="170" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="375" y="107.3" class="t" font-size="13" text-anchor="middle" font-weight="600">hold a slot</text>
<rect x="290" y="200" width="170" height="46" rx="6" class="f-faint" />
<rect x="290" y="200" width="170" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="375" y="227.3" class="t" font-size="13" text-anchor="middle" font-weight="600">release the slot</text>
<line x1="375" y1="128" x2="375" y2="196" class="s-ink" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-ink)"/>
<text x="375" y="266" class="tm" font-size="11" text-anchor="middle" font-weight="normal">cheap, invisible</text>
<line x1="462" y1="103" x2="516" y2="103" class="s-ink" stroke-width="1.6" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="520" y="80" width="170" height="46" rx="6" class="f-soft-amber" />
<rect x="520" y="80" width="170" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="605" y="107.3" class="t" font-size="13" text-anchor="middle" font-weight="600">charge the card</text>
<rect x="520" y="200" width="170" height="46" rx="6" class="f-faint" />
<rect x="520" y="200" width="170" height="46" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="605" y="227.3" class="t" font-size="13" text-anchor="middle" font-weight="600">refund</text>
<line x1="605" y1="128" x2="605" y2="196" class="s-ink" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-ink)"/>
<text x="605" y="266" class="tm" font-size="11" text-anchor="middle" font-weight="normal">days, on the statement</text>
<text x="153" y="166" class="tm" font-size="11" text-anchor="start" font-weight="normal">undo, if a later step fails</text>
<text x="30" y="300" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Tolu's grocery orders. The card is charged last, so its compensation, the refund, is needed least.</text>
</svg>
