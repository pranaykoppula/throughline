<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">A linked list and an array, laid out in memory</title>
<desc id="d">Memory drawn as a row of cells. Top: six particles of a linked list, each allocated wherever memory was free, so walking from one to the next jumps back and forth across memory, and almost every jump misses the cache. Bottom: the same particles in an array, side by side, read in one straight line, with each fetch from memory bringing several particles at once.</desc>

