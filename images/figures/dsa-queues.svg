<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d">
<title id="t">One line, or three</title>
<desc id="d">Two ways of queuing outgoing email in front of the same workers. Top: one first-in, first-out queue, where a retailer's two million newsletters arrived first and a password reset waits behind all of them, for hours. Bottom: three queues, urgent mail first, then receipts, then bulk, with bulk guaranteed a share of the workers and each bulk customer served in turn, so the reset waits seconds.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="390" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">One queue, first in, first out</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Tuesday morning: the newsletter went in first</text>
<rect x="40" y="76" width="560" height="34" rx="4" class="f-faint" />
<rect x="130" y="80" width="460" height="26" rx="3" class="f-soft-amber" />
<text x="360" y="98" class="t" font-size="12" text-anchor="middle" font-weight="600">2,000,000 newsletters, one retailer</text>
<rect x="52" y="80" width="66" height="26" rx="3" class="f-warn" />
<text x="85" y="98" class="t" font-size="11.5" text-anchor="middle" font-weight="600">reset</text>
<line x1="604" y1="93" x2="630" y2="93" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="636" y="72" width="84" height="42" rx="6" class="f-faint" />
<rect x="636" y="72" width="84" height="42" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="678" y="97.3" class="t" font-size="13" text-anchor="middle" font-weight="600">workers</text>
<text x="40" y="132" class="t" font-size="12" text-anchor="start" font-weight="normal">The reset waits behind every newsletter: hours, with the workers as fast as ever.</text>
<text x="30" y="172" class="t" font-size="15" text-anchor="start" font-weight="600">Three queues, and who goes next decided on purpose</text>
<text x="30" y="191" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Urgent first, then receipts; bulk always gets a share, one customer at a time</text>
<text x="40" y="232" class="t" font-size="12.5" text-anchor="start" font-weight="600">Urgent</text>
<rect x="130" y="210" width="470" height="34" rx="4" class="f-faint" />
<rect x="506" y="214" width="76" height="26" rx="3" class="f-warn" />
<text x="544" y="232" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">reset</text>
<rect x="424" y="214" width="76" height="26" rx="3" class="f-warn" />
<text x="462" y="232" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">code</text>
<line x1="604" y1="227" x2="630" y2="227" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="140" y="232" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">first</text>
<text x="40" y="278" class="t" font-size="12.5" text-anchor="start" font-weight="600">Receipts</text>
<rect x="130" y="256" width="470" height="34" rx="4" class="f-faint" />
<rect x="506" y="260" width="76" height="26" rx="3" class="f-soft-accent" />
<text x="544" y="278" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">receipt</text>
<rect x="424" y="260" width="76" height="26" rx="3" class="f-soft-accent" />
<text x="462" y="278" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">receipt</text>
<rect x="342" y="260" width="76" height="26" rx="3" class="f-soft-accent" />
<text x="380" y="278" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">receipt</text>
<line x1="604" y1="273" x2="630" y2="273" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="140" y="278" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">next</text>
<text x="40" y="324" class="t" font-size="12.5" text-anchor="start" font-weight="600">Bulk</text>
<rect x="130" y="302" width="470" height="34" rx="4" class="f-faint" />
<rect x="506" y="306" width="76" height="26" rx="3" class="f-soft-amber" />
<text x="544" y="324" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">retailer</text>
<rect x="424" y="306" width="76" height="26" rx="3" class="f-faint" />
<text x="462" y="324" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">shop B</text>
<rect x="342" y="306" width="76" height="26" rx="3" class="f-soft-amber" />
<text x="380" y="324" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">retailer</text>
<rect x="260" y="306" width="76" height="26" rx="3" class="f-faint" />
<text x="298" y="324" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">shop C</text>
<line x1="604" y1="319" x2="630" y2="319" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="140" y="324" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">always a share</text>
<rect x="636" y="206" width="84" height="126" rx="6" class="f-faint" />
<rect x="636" y="206" width="84" height="126" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="678" y="273.3" class="t" font-size="13" text-anchor="middle" font-weight="600">workers</text>
<text x="40" y="362" class="t" font-size="12" text-anchor="start" font-weight="normal">The reset waits seconds. The newsletter still goes out, and no one sender holds up another.</text>
<text x="30" y="382" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Yusuf's mail service; queue lengths are not to scale.</text>
</svg>
