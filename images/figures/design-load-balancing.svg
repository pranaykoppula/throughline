<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Where the broken server's share came from</title>
<desc id="d">A bar chart of the share of searches sent to the one broken server, out of twenty. Round robin: five percent, its fair share. Least connections: about sixty percent, because failing fast made it look the least busy. Two random choices: about ten percent at most, because it can only win when it's one of the two picked.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="330" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Share of all searches sent to the broken server</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">One server out of twenty, failing every search in two milliseconds</text>
<line x1="100" y1="250" x2="700" y2="250" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="254" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">0%</text>
<line x1="100" y1="198.5" x2="700" y2="198.5" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="202.5" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">20%</text>
<line x1="100" y1="147" x2="700" y2="147" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="151" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">40%</text>
<line x1="100" y1="95.5" x2="700" y2="95.5" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="99.5" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">60%</text>
<line x1="100" y1="250" x2="700" y2="250" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="400" y="286" class="tm" font-size="12" text-anchor="middle" font-weight="normal"></text>
<text x="54" y="68" class="tm" font-size="12" text-anchor="start" font-weight="normal">share</text>
<rect x="140" y="237.1" width="120" height="12.9" rx="3" class="f-accent" />
<text x="200" y="268" class="t" font-size="12.5" text-anchor="middle" font-weight="600">round robin</text>
<text x="200" y="229.1" class="tm" font-size="11" text-anchor="middle" font-weight="normal">5%: its turn, one in twenty</text>
<rect x="340" y="95.5" width="120" height="154.5" rx="3" class="f-warn" />
<text x="400" y="268" class="t" font-size="12.5" text-anchor="middle" font-weight="600">least connections</text>
<text x="400" y="87.5" class="tm" font-size="11" text-anchor="middle" font-weight="normal">about 60%: it always looked least busy</text>
<rect x="540" y="224.2" width="120" height="25.8" rx="3" class="f-ok" />
<text x="600" y="268" class="t" font-size="12.5" text-anchor="middle" font-weight="600">two random choices</text>
<text x="600" y="216.2" class="tm" font-size="11" text-anchor="middle" font-weight="normal">at most 10%: only when it's one of the two</text>
<text x="30" y="316" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Tomasz's twenty search servers. The fair share is one in twenty; two random choices can at most double it.</text>
</svg>
