<text x="92" y="182.6" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">10 MB</text>
<line x1="100" y1="145.7" x2="620" y2="145.7" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="149.7" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">100 MB</text>
<line x1="100" y1="112.9" x2="620" y2="112.9" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="116.9" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1 GB</text>
<line x1="100" y1="80" x2="620" y2="80" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="84" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">10 GB</text>
<text x="100" y="327" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">1,000</text>
<text x="204" y="327" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">10,000</text>
<text x="308" y="327" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">100,000</text>
<text x="412" y="327" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">1 million</text>
<text x="516" y="327" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">10 million</text>
<text x="620" y="327" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">100 million</text>
<line x1="100" y1="310" x2="620" y2="310" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="360" y="346" class="tm" font-size="12" text-anchor="middle" font-weight="normal">Different readers counted</text>
<text x="54" y="68" class="tm" font-size="12" text-anchor="start" font-weight="normal">Memory</text>
