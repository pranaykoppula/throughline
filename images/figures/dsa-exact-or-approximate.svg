<text x="318.8" y="186.2" class="t" font-size="12" text-anchor="end" font-weight="normal">exact: about 16 bytes per reader</text>
<text x="614" y="264.2" class="t" font-size="12" text-anchor="end" font-weight="normal">HyperLogLog: 12 KB, about ±1%</text>
<text x="30" y="365" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Assumes 16 bytes per stored reader ID; real sets use more once overheads are counted.</text>
