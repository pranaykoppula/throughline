<text x="30" y="210" class="t" font-size="15" text-anchor="start" font-weight="600">Merged every day</text>
<text x="30" y="229" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Small changes, each reviewed and tested before it goes in</text>
