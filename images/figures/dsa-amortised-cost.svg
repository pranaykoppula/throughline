<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Paying in lumps, or in small steps</title>
<desc id="d">Two panels. Left: the cost of each operation over time, nearly zero most of the time with tall, rare spikes, and a flat dashed line showing the low average. Right: the same work done in many small steps, with no tall spikes and a slightly higher average.</desc>

