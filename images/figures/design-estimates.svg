<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">An ordinary day and Halloween</title>
<desc id="d">A line chart of clip uploads through a day, as multiples of the daily average. An ordinary weekday rises from almost nothing at night to about three times the average in the evening. On Halloween the evening climbs to about twenty-five times the average between six and eight o'clock. A dashed line at three times the average marks the upload capacity Nkechi rented, which the Halloween evening exceeds for two hours.</desc>

