<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d">
<title id="t">Moving one kind of payment at a time</title>
<desc id="d">A thin routing layer sends each kind of payment to the old system or the new one. Standing orders move first; each night both systems process them and the results are compared, and only after a month of exact matches does the switch happen. Other kinds follow over years; settlement stays.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="390" class="bg"/>
<rect x="300" y="24" width="160" height="40" rx="6" class="f-faint" />
<rect x="300" y="24" width="160" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="380" y="48.3" class="t" font-size="13" text-anchor="middle" font-weight="600">payments</text>
<line x1="380" y1="64" x2="380" y2="92" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="230" y="94" width="300" height="40" rx="6" class="f-soft-accent" />
<rect x="230" y="94" width="300" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="380" y="118.3" class="t" font-size="13" text-anchor="middle" font-weight="600">routing layer</text>
<rect x="60" y="200" width="220" height="60" rx="6" class="f-faint" />
<rect x="60" y="200" width="220" height="60" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="170" y="228" class="t" font-size="13" text-anchor="middle" font-weight="600">old system</text>
<text x="170" y="243" class="tm" font-size="11" text-anchor="middle" font-weight="normal">COBOL, since 1979</text>
<rect x="480" y="200" width="220" height="60" rx="6" class="f-soft-ok" />
<rect x="480" y="200" width="220" height="60" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="590" y="228" class="t" font-size="13" text-anchor="middle" font-weight="600">new system</text>
<text x="590" y="243" class="tm" font-size="11" text-anchor="middle" font-weight="normal">moved one kind at a time</text>
<line x1="330" y1="134" x2="200" y2="198" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<line x1="430" y1="134" x2="560" y2="198" class="s-ok" stroke-width="1.4" fill="none" marker-end="url(#arrow-ok)"/>
<line x1="280" y1="245" x2="478" y2="245" class="s-amber" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
<text x="380" y="238" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">both run every night</text>
<text x="380" y="272" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">results compared</text>
<text x="60" y="312" class="t" font-size="12.5" text-anchor="start" font-weight="normal">Each mismatch was a rule nobody had written down, found one at a time.</text>
<rect x="60" y="330" width="200" height="40" rx="5" class="f-soft-ok" />
<text x="160" y="347" class="t" font-size="12" text-anchor="middle" font-weight="600">standing orders</text>
<text x="160" y="363" class="tm" font-size="11" text-anchor="middle" font-weight="normal">moved first, in four months</text>
<rect x="280" y="330" width="200" height="40" rx="5" class="f-soft-ok" />
<text x="380" y="347" class="t" font-size="12" text-anchor="middle" font-weight="600">most other kinds</text>
<text x="380" y="363" class="tm" font-size="11" text-anchor="middle" font-weight="normal">moved over four years</text>
<rect x="500" y="330" width="200" height="40" rx="5" class="f-faint" />
<text x="600" y="347" class="t" font-size="12" text-anchor="middle" font-weight="600">core settlement</text>
<text x="600" y="363" class="tm" font-size="11" text-anchor="middle" font-weight="normal">stayed, by choice</text>
</svg>
