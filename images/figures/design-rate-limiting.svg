<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">Doing less by accepting more</title>
<desc id="d">A line chart of useful answers per second against requests arriving per second. Without limits, useful answers rise with demand up to the database's capacity of about 2,000 a second, then fall towards almost nothing as timeouts and retries take over. With limits and load shedding, useful answers rise to the same capacity and stay there, however much more arrives.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="370" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Useful answers, as demand grows past capacity</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Answers that reached someone still waiting for them</text>
<line x1="100" y1="290" x2="700" y2="290" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="294" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">0</text>
<line x1="100" y1="244.3" x2="700" y2="244.3" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="248.3" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">500</text>
<line x1="100" y1="198.7" x2="700" y2="198.7" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="202.7" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1,000</text>
<line x1="100" y1="153" x2="700" y2="153" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="157" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">1,500</text>
<line x1="100" y1="107.4" x2="700" y2="107.4" class="s-line" stroke-width="1" fill="none"/>
<text x="92" y="111.4" class="tm" font-size="11.5" text-anchor="end" font-weight="normal">2,000</text>
<text x="100" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">0</text>
<text x="220" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">2,000</text>
<text x="340" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">4,000</text>
<text x="460" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">6,000</text>
<text x="580" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">8,000</text>
<text x="700" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">10,000</text>
<line x1="100" y1="290" x2="700" y2="290" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="400" y="326" class="tm" font-size="12" text-anchor="middle" font-weight="normal">requests arriving per second</text>
<text x="54" y="68" class="tm" font-size="12" text-anchor="start" font-weight="normal">useful/s</text>
