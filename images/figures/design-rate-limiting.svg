<path d="M 100 290 L 106 280.9 L 112 271.7 L 118 262.6 L 124 253.5 L 130 244.3 L 136 235.2 L 142 226.1 L 148 217 L 154 207.8 L 160 198.7 L 166 189.6 L 172 180.4 L 178 171.3 L 184 162.2 L 190 153 L 196 143.9 L 202 134.8 L 208 125.7 L 214 116.5 L 220 107.4 L 226 115.5 L 232 123.3 L 238 130.7 L 244 137.7 L 250 144.5 L 256 151 L 262 157.2 L 268 163.1 L 274 168.7 L 280 174.1 L 286 179.2 L 292 184.2 L 298 188.9 L 304 193.4 L 310 197.7 L 316 201.8 L 322 205.7 L 328 209.4 L 334 213 L 340 216.4 L 346 219.7 L 352 222.8 L 358 225.8 L 364 228.7 L 370 231.4 L 376 234 L 382 236.5 L 388 238.9 L 394 241.1 L 400 243.3 L 406 245.4 L 412 247.4 L 418 249.3 L 424 251.1 L 430 252.8 L 436 254.4 L 442 256 L 448 257.5 L 454 259 L 460 260.4 L 466 261.7 L 472 262.9 L 478 264.1 L 484 265.3 L 490 266.4 L 496 267.4 L 502 268.4 L 508 269.4 L 514 270.3 L 520 271.2 L 526 272 L 532 272.8 L 538 273.6 L 544 274.3 L 550 275 L 556 275.7 L 562 276.3 L 568 276.9 L 574 277.5 L 580 278.1 L 586 278.6 L 592 279.1 L 598 279.6 L 604 280 L 610 280.5 L 616 280.9 L 622 281.3 L 628 281.7 L 634 282.1 L 640 282.4 L 646 282.8 L 652 283.1 L 658 283.4 L 664 283.7 L 670 284 L 676 284.2 L 682 284.5 L 688 284.7 L 694 285 L 700 285.2" class="s-warn" stroke-width="2.5" fill="none" />
<line x1="220" y1="80" x2="220" y2="290" class="s-line" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="226" y="96" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">capacity</text>
<text x="688" y="113.1" class="t" font-size="12" text-anchor="end" font-weight="600">with limits and load shedding</text>
<text x="412" y="235.2" class="t" font-size="12" text-anchor="start" font-weight="600">accepting everything</text>
<text x="30" y="356" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Illustrative curves for Farida's API; the database's capacity is taken as 2,000 answers a second.</text>
</svg>
