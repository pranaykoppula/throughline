<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Flags that allow anything, or states that allow only what's real</title>
<desc id="d">Left: five yes-or-no fields on an order make thirty-two combinations, and code could set any of them; three impossible combinations Chloe found are marked: cancelled and shipped, on forty orders; refunded but not paid, on eleven; paid, cancelled and awaiting stock at once, on three. Right: nine states and the moves the business allowed between them. Placed goes to paid or cancelled; paid to awaiting stock, packing, or cancelled and refunded; awaiting stock to packing; packing to shipped; shipped to delivered or returned. There is no arrow from cancelled to shipped.</desc>

