<text x="305" y="145" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a follower's feed</text>
<line x1="160" y1="182" x2="248" y2="141" class="s-accent" stroke-width="1.1" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="250" y="160" width="110" height="22" rx="4" class="f-faint" />
<text x="305" y="175" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a follower's feed</text>
<line x1="160" y1="182" x2="248" y2="171" class="s-accent" stroke-width="1.1" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="250" y="190" width="110" height="22" rx="4" class="f-faint" />
<text x="305" y="205" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a follower's feed</text>
<line x1="160" y1="182" x2="248" y2="201" class="s-accent" stroke-width="1.1" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="250" y="220" width="110" height="22" rx="4" class="f-faint" />
<text x="305" y="235" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a follower's feed</text>
<line x1="160" y1="182" x2="248" y2="231" class="s-accent" stroke-width="1.1" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="250" y="250" width="110" height="22" rx="4" class="f-faint" />
<text x="305" y="265" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a follower's feed</text>
<line x1="160" y1="182" x2="248" y2="261" class="s-accent" stroke-width="1.1" fill="none" marker-end="url(#arrow-accent)"/>
<rect x="250" y="280" width="110" height="22" rx="4" class="f-faint" />
<text x="305" y="295" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a follower's feed</text>
<line x1="160" y1="182" x2="248" y2="291" class="s-accent" stroke-width="1.1" fill="none" marker-end="url(#arrow-accent)"/>
<text x="305" y="325" class="t" font-size="12" text-anchor="middle" font-weight="normal">Opening the app: one lookup</text>
<text x="400" y="30" class="t" font-size="15" text-anchor="start" font-weight="600">A few huge accounts: read at opening time</text>
<text x="400" y="49" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">1.8 million writes per post was too many</text>
<rect x="410" y="90" width="150" height="44" rx="6" class="f-soft-amber" />
<rect x="410" y="90" width="150" height="44" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="485" y="116.3" class="t" font-size="13" text-anchor="middle" font-weight="600">the champion posts</text>
<text x="485" y="156" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">stored once</text>
<rect x="600" y="200" width="130" height="60" rx="6" class="f-faint" />
<rect x="600" y="200" width="130" height="60" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="665" y="228" class="t" font-size="13" text-anchor="middle" font-weight="600">a follower opens</text>
<text x="665" y="243" class="tm" font-size="11" text-anchor="middle" font-weight="normal">the app</text>
<line x1="560" y1="120" x2="650" y2="198" class="s-amber" stroke-width="1.4" fill="none" marker-end="url(#arrow-amber)"/>
<text x="640" y="150" class="tm" font-size="11" text-anchor="start" font-weight="normal">fetched</text>
<text x="640" y="164" class="tm" font-size="11" text-anchor="start" font-weight="normal">on opening</text>
<rect x="420" y="200" width="150" height="60" rx="6" class="f-soft-accent" />
<text x="495" y="226" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">ready-made feed</text>
<text x="495" y="242" class="tm" font-size="10.5" text-anchor="middle" font-weight="normal">from everyone else</text>
<line x1="570" y1="230" x2="598" y2="230" class="s-accent" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
<text x="570" y="325" class="t" font-size="12" text-anchor="middle" font-weight="normal">Mixed together: nobody waits</text>
