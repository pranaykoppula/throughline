<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">A clock four seconds fast</title>
<desc id="d">A timeline of two updates to the same hotel room, seen by two servers. In true time, the room is marked available at 14:00:01 and then sold at 14:00:03. The fast server, four seconds ahead, stamps the older "available" update 14:00:05, so by timestamps it looks later and wins, and the sold room goes back on sale. With version numbers, the sale is version 8, the stale update names version 7, and the database refuses it.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="360" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Two updates to one room</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">What really happened, what the timestamps said, and what version numbers say</text>
<text x="30" y="100" class="t" font-size="12.5" text-anchor="start" font-weight="600">true time</text>
<line x1="130" y1="96" x2="730" y2="96" class="s-line" stroke-width="1.2" fill="none"/>
<text x="30" y="180" class="t" font-size="12.5" text-anchor="start" font-weight="600">timestamps</text>
<line x1="130" y1="176" x2="730" y2="176" class="s-line" stroke-width="1.2" fill="none"/>
<text x="30" y="260" class="t" font-size="12.5" text-anchor="start" font-weight="600">versions</text>
<line x1="130" y1="256" x2="730" y2="256" class="s-line" stroke-width="1.2" fill="none"/>
<rect x="170" y="76" width="200" height="40" rx="6" class="f-soft-accent" />
<rect x="170" y="76" width="200" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="270" y="94" class="t" font-size="13" text-anchor="middle" font-weight="600">available</text>
<text x="270" y="109" class="tm" font-size="11" text-anchor="middle" font-weight="normal">14:00:01, via the fast server</text>
<rect x="420" y="76" width="200" height="40" rx="6" class="f-soft-ok" />
<rect x="420" y="76" width="200" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="520" y="94" class="t" font-size="13" text-anchor="middle" font-weight="600">sold</text>
<text x="520" y="109" class="tm" font-size="11" text-anchor="middle" font-weight="normal">14:00:03, via another server</text>
<rect x="170" y="156" width="200" height="40" rx="6" class="f-soft-ok" />
<rect x="170" y="156" width="200" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="270" y="174" class="t" font-size="13" text-anchor="middle" font-weight="600">sold</text>
<text x="270" y="189" class="tm" font-size="11" text-anchor="middle" font-weight="normal">stamped 14:00:03</text>
<rect x="420" y="156" width="200" height="40" rx="6" class="f-soft-warn" />
<rect x="420" y="156" width="200" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="520" y="174" class="t" font-size="13" text-anchor="middle" font-weight="600">available</text>
<text x="520" y="189" class="tm" font-size="11" text-anchor="middle" font-weight="normal">stamped 14:00:05: wins</text>
<text x="640" y="180" class="t" font-size="11.5" text-anchor="start" font-weight="600">room back on sale</text>
<rect x="170" y="236" width="200" height="40" rx="6" class="f-soft-ok" />
<rect x="170" y="236" width="200" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="270" y="254" class="t" font-size="13" text-anchor="middle" font-weight="600">sold</text>
<text x="270" y="269" class="tm" font-size="11" text-anchor="middle" font-weight="normal">version 7 to 8</text>
<rect x="420" y="236" width="200" height="40" rx="6" class="f-soft-warn" />
<rect x="420" y="236" width="200" height="40" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="520" y="254" class="t" font-size="13" text-anchor="middle" font-weight="600">available</text>
<text x="520" y="269" class="tm" font-size="11" text-anchor="middle" font-weight="normal">names version 7</text>
<text x="640" y="260" class="t" font-size="11.5" text-anchor="start" font-weight="600">refused: now 8</text>
<text x="30" y="320" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Emre's booking system. The four-second drift is from the story; the times are illustrative.</text>
</svg>
