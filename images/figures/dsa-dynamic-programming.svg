<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="t d">
<title id="t">A table of answers to smaller questions</title>
<desc id="d">A table comparing two short words letter by letter, one along the top and one down the side. Each cell holds the length of the longest common run of letters for those two prefixes. A highlighted path runs from the bottom-right corner back to the top-left, marking the letters the two words share.</desc>

