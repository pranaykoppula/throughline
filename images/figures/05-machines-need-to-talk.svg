<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Waiting for every reply, or sending ahead</title>
<desc id="d">Two timelines of the same transfer across a long link. Top: send one block, wait a whole round trip for the confirmation, then send the next. Bottom: send eight numbered blocks before waiting; the confirmations come back while more blocks are going out.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="330" class="bg"/>
<text x="30" y="40" class="t" font-size="15" text-anchor="start" font-weight="600">One at a time</text>
<text x="30" y="59" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Blue: sending a block. Grey: waiting for its confirmation</text>
<rect x="140" y="70" width="20" height="26" rx="3" class="f-accent" />
<text x="150" y="87" class="t" font-size="10" text-anchor="middle" font-weight="normal">1</text>
<rect x="162" y="70" width="174" height="26" rx="3" class="f-line" />
<rect x="338" y="70" width="20" height="26" rx="3" class="f-accent" />
<text x="348" y="87" class="t" font-size="10" text-anchor="middle" font-weight="normal">2</text>
<rect x="360" y="70" width="174" height="26" rx="3" class="f-line" />
<rect x="536" y="70" width="20" height="26" rx="3" class="f-accent" />
<text x="546" y="87" class="t" font-size="10" text-anchor="middle" font-weight="normal">3</text>
<text x="130" y="87" class="t" font-size="12" text-anchor="end" font-weight="normal">3 blocks</text>
<text x="30" y="170" class="t" font-size="15" text-anchor="start" font-weight="600">Eight in flight</text>
<text x="30" y="189" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Numbered blocks; the line is never idle for long</text>
<rect x="140" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="150" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">1</text>
<rect x="162" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="172" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">2</text>
<rect x="184" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="194" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">3</text>
<rect x="206" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="216" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">4</text>
<rect x="228" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="238" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">5</text>
<rect x="250" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="260" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">6</text>
<rect x="272" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="282" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">7</text>
<rect x="294" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="304" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">8</text>
<rect x="316" y="200" width="20" height="26" rx="3" class="f-line" />
<rect x="338" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="348" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">9</text>
<rect x="360" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="370" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">10</text>
<rect x="382" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="392" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">11</text>
<rect x="404" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="414" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">12</text>
<rect x="426" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="436" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">13</text>
<rect x="448" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="458" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">14</text>
<rect x="470" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="480" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">15</text>
<rect x="492" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="502" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">16</text>
<rect x="514" y="200" width="20" height="26" rx="3" class="f-line" />
<rect x="536" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="546" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">17</text>
<rect x="558" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="568" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">18</text>
<rect x="580" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="590" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">19</text>
<rect x="602" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="612" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">20</text>
<rect x="624" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="634" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">21</text>
<rect x="646" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="656" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">22</text>
<rect x="668" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="678" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">23</text>
<rect x="690" y="200" width="20" height="26" rx="3" class="f-accent" />
<text x="700" y="217" class="t" font-size="10" text-anchor="middle" font-weight="normal">24</text>
<text x="130" y="217" class="t" font-size="12" text-anchor="end" font-weight="normal">24 blocks</text>
<line x1="140" y1="120" x2="712" y2="120" class="s-ink" stroke-width="1" fill="none"/>
<text x="426" y="140" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">the same stretch of time</text>
<text x="30" y="300" class="tm" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">Lin's transfer went eight times faster. The cost of moving data was the number of round trips,</text>
<text x="30" y="318" class="tm" font-size="12" text-anchor="start" font-weight="normal" font-style="italic">not its size. Numbering the blocks also let the receiver throw away duplicates.</text>
</svg>
