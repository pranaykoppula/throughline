<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Following the hashes that differ</title>
<desc id="d">A tree of hashes for a file server: one hash at the top, four folders, three files in each folder, and the blocks of two files. Comparing top-down, the top hash differs, so the four folder hashes are compared; two differ and two match. Only the files inside the two differing folders are compared, then only the blocks of the two differing files, which finds three corrupted blocks. Matching branches are never opened.</desc>

