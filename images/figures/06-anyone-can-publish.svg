<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Two copies of the day, and one owner of the truth</title>
<desc id="d">A server and two receptionists' browsers. Both browsers show ten o'clock as free, from copies loaded that morning. Both book it. Before: the server saves both bookings. After: the server checks the slot is still free and refuses the second, which is told the slot was just taken.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="400" class="bg"/>
<rect x="35" y="20" width="150" height="38" rx="6" class="f-faint" />
<rect x="35" y="20" width="150" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="110" y="43.3" class="t" font-size="13" text-anchor="middle" font-weight="600">receptionist A</text>
<line x1="110" y1="58" x2="110" y2="380" class="s-line" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<rect x="305" y="20" width="150" height="38" rx="6" class="f-soft-accent" />
<rect x="305" y="20" width="150" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="380" y="43.3" class="t" font-size="13" text-anchor="middle" font-weight="600">server</text>
<line x1="380" y1="58" x2="380" y2="380" class="s-line" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<rect x="575" y="20" width="150" height="38" rx="6" class="f-faint" />
<rect x="575" y="20" width="150" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="650" y="43.3" class="t" font-size="13" text-anchor="middle" font-weight="600">receptionist B</text>
<line x1="650" y1="58" x2="650" y2="380" class="s-line" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="110" y="82" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">copy: 10:00 free</text>
<text x="650" y="82" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">copy: 10:00 free</text>
<line x1="110" y1="110" x2="376" y2="130" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="245" y="108" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">book 10:00</text>
<line x1="650" y1="140" x2="384" y2="160" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="515" y="138" class="t" font-size="11.5" text-anchor="middle" font-weight="normal">book 10:00</text>
<rect x="225" y="190" width="310" height="70" rx="6" class="f-soft-warn" />
<text x="380" y="212" class="t" font-size="12.5" text-anchor="middle" font-weight="600">Before: the server saved both</text>
<text x="380" y="232" class="t" font-size="12" text-anchor="middle" font-weight="normal">two patients, one ten o'clock filling</text>
<rect x="225" y="280" width="310" height="90" rx="6" class="f-soft-ok" />
<text x="380" y="302" class="t" font-size="12.5" text-anchor="middle" font-weight="600">After: the server checks first</text>
<text x="380" y="322" class="t" font-size="12" text-anchor="middle" font-weight="normal">A's booking: accepted</text>
<text x="380" y="340" class="t" font-size="12" text-anchor="middle" font-weight="normal">B's booking: refused, "that slot was just taken"</text>
<line x1="535" y1="345" x2="646" y2="345" class="s-ok" stroke-width="1.5" fill="none" marker-end="url(#arrow-ok)"/>
<text x="650" y="368" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">refreshes the day</text>
</svg>
