<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d">
<title id="t">Writing where the data belongs, or writing in order</title>
<desc id="d">Two ways of writing monitoring data to one disk. Top: a B-tree index updated in place, where points from thousands of servers arrive interleaved and each write lands on a different page, so the disk jumps back and forth. Bottom: points are sorted in memory and written out in long sequential runs as unchangeable files, which a background process later merges into fewer, larger files.</desc>

