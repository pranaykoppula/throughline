<text x="40" y="142" class="t" font-size="12" text-anchor="start" font-weight="normal">The disk spends its time seeking, to change a few bytes here and a few bytes there.</text>
<text x="30" y="172" class="t" font-size="15" text-anchor="start" font-weight="600">Sort in memory, write in order, merge later</text>
<text x="30" y="191" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">When memory holds a few hundred megabytes, write it out in one pass</text>
