<text x="540" y="324" class="t" font-size="12" text-anchor="start" font-weight="600">the cost paid later</text>
<text x="40" y="356" class="t" font-size="12" text-anchor="start" font-weight="normal">Writes became long runs, which the disk is fast at. Reads now check memory and several files, newest first.</text>
<text x="30" y="380" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Neha's system: 150,000 points a second. Positions on the disk are illustrative.</text>
