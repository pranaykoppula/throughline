<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Growing a hash table all at once, and a little at a time</title>
<desc id="d">Two timelines of a game server over ninety seconds. Top: the table doubles all at once at the thirtieth second, moving four million entries, and the server answers nothing for nearly two seconds. Bottom: the same four million entries are moved a few at a time with every request, spread over a minute, and the server keeps answering throughout.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="330" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">All at once</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Allocate a table twice the size, then move every entry</text>
<rect x="40" y="68" width="680" height="26" rx="4" class="f-soft-ok" />
<rect x="266.7" y="64" width="15.1" height="34" rx="2" class="f-warn" />
<text x="266.7" y="118" class="t" font-size="11.5" text-anchor="start" font-weight="normal">nearly two seconds: 4 million entries moved at once, no answers, every player frozen</text>
<text x="30" y="157" class="t" font-size="15" text-anchor="start" font-weight="600">A little at a time</text>
<text x="30" y="176" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Every request also moves a few entries across</text>
<rect x="40" y="193" width="680" height="26" rx="4" class="f-soft-ok" />
<rect x="266.7" y="202" width="453.3" height="8" rx="2" class="f-amber" />
<text x="266.7" y="243" class="t" font-size="11.5" text-anchor="start" font-weight="normal">the same 4 million entries, microseconds per request, over a minute: nobody noticed</text>
<text x="40" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">0s</text>
<text x="153.3" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">15s</text>
<text x="266.7" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">30s</text>
<text x="380" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">45s</text>
<text x="493.3" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">60s</text>
<text x="606.7" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">75s</text>
<text x="720" y="300" class="tm" font-size="11" text-anchor="middle" font-weight="normal">90s</text>
<text x="30" y="322" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Green: the server answering. The table fills past three-quarters at the thirtieth second.</text>
</svg>
