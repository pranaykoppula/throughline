<text x="202" y="222.1" class="tm" font-size="11" text-anchor="start" font-weight="normal">fifth failure: moved to the dead-letter queue</text>
<text x="436" y="141.4" class="t" font-size="12" text-anchor="end" font-weight="600">no retry limit: every worker crashes in turn</text>
<text x="388" y="270.6" class="t" font-size="12" text-anchor="start" font-weight="600">five tries, then a dead-letter queue</text>
<text x="30" y="356" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Siobhán's photo workers. The two hours and twenty minutes are from the story; the curves are illustrative.</text>
