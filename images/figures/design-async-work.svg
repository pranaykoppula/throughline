<text x="676" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">120</text>
<line x1="100" y1="290" x2="700" y2="290" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="400" y="326" class="tm" font-size="12" text-anchor="middle" font-weight="normal">minutes since the bad photo arrived</text>
<text x="54" y="68" class="tm" font-size="12" text-anchor="start" font-weight="normal">age</text>
