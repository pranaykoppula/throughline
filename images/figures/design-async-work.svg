<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">One photo that could never succeed</title>
<desc id="d">A line chart of the age of the oldest waiting photo during the morning of the bad photo. Without a retry limit, every worker crashes on the same photo in turn and the oldest age climbs steadily to about two hours. With a limit of five tries and a dead-letter queue, the bad photo is set aside after about twenty minutes and the oldest age falls back to a few minutes.</desc>

