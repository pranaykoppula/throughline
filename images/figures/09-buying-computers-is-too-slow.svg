<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">Buying capacity, or renting it</title>
<desc id="d">Demand over two weeks with a sudden spike. Bought servers stay flat until new ones arrive five weeks later, so the spike is lost. Rented capacity rises within minutes to follow the spike and falls after it.</desc>

