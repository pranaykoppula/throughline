<text x="700" y="307" class="tm" font-size="11.5" text-anchor="middle" font-weight="normal">240</text>
<line x1="100" y1="290" x2="700" y2="290" class="s-ink" stroke-width="1.2" fill="none"/>
<text x="400" y="326" class="tm" font-size="12" text-anchor="middle" font-weight="normal">seconds</text>
<text x="54" y="68" class="tm" font-size="12" text-anchor="start" font-weight="normal">threads</text>
<line x1="100" y1="94.7" x2="700" y2="94.7" class="s-warn" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
