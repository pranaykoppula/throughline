<text x="425" y="114.2" class="t" font-size="12" text-anchor="start" font-weight="600">default timeout: every thread waits</text>
<text x="425" y="254.8" class="t" font-size="12" text-anchor="start" font-weight="600">150 ms timeout, own pool, circuit breaker</text>
<text x="30" y="356" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Ji-woo's bookshop. The two hundred threads and the timings are from the story; the curves are illustrative.</text>
