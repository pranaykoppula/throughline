<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">A retry, with and without a key</title>
<desc id="d">Two timelines between the app's server and the payment provider. Top, without a key: the first charge succeeds but its reply is lost, the server times out after ten seconds and retries, and the provider charges the card a second time. Bottom, with an idempotency key: the retry carries the same key, the provider recognises it, and returns the first charge's result without charging again.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="420" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Without a key</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">The reply is lost, so the server can't tell the charge went through</text>
<text x="40" y="86" class="t" font-size="12.5" text-anchor="start" font-weight="600">server</text>
<text x="40" y="176" class="t" font-size="12.5" text-anchor="start" font-weight="600">provider</text>
<line x1="120" y1="82" x2="720" y2="82" class="s-line" stroke-width="1.2" fill="none"/>
<line x1="120" y1="172" x2="720" y2="172" class="s-line" stroke-width="1.2" fill="none"/>
<line x1="150" y1="82" x2="240" y2="168" class="s-accent" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)"/>
<text x="178" y="112" class="tm" font-size="11" text-anchor="start" font-weight="normal">charge 45,000</text>
<rect x="232" y="170" width="74" height="22" rx="3" class="f-soft-warn" />
<text x="269" y="185" class="t" font-size="11.5" text-anchor="middle" font-weight="600">charged</text>
<line x1="300" y1="168" x2="360" y2="116" class="s-warn" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
<text x="368" y="118" class="tm" font-size="11" text-anchor="start" font-weight="normal">reply lost</text>
<text x="420" y="74" class="tm" font-size="11" text-anchor="middle" font-weight="normal">10 s: timeout, retry</text>
<line x1="420" y1="82" x2="510" y2="168" class="s-accent" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)"/>
<text x="476" y="112" class="tm" font-size="11" text-anchor="start" font-weight="normal">charge 45,000</text>
<rect x="500" y="170" width="130" height="22" rx="3" class="f-soft-warn" />
<text x="565" y="185" class="t" font-size="11.5" text-anchor="middle" font-weight="600">charged again</text>
<text x="30" y="222" class="t" font-size="15" text-anchor="start" font-weight="600">With an idempotency key</text>
<text x="30" y="241" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Every retry carries the key made before the first attempt</text>
<text x="40" y="276" class="t" font-size="12.5" text-anchor="start" font-weight="600">server</text>
<text x="40" y="366" class="t" font-size="12.5" text-anchor="start" font-weight="600">provider</text>
<line x1="120" y1="272" x2="720" y2="272" class="s-line" stroke-width="1.2" fill="none"/>
<line x1="120" y1="362" x2="720" y2="362" class="s-line" stroke-width="1.2" fill="none"/>
<line x1="150" y1="272" x2="240" y2="358" class="s-accent" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)"/>
<text x="160" y="302" class="tm" font-size="11" text-anchor="start" font-weight="normal">charge, key A17</text>
<rect x="232" y="360" width="110" height="22" rx="3" class="f-soft-ok" />
<text x="287" y="375" class="t" font-size="11.5" text-anchor="middle" font-weight="600">charged; A17 saved</text>
<line x1="320" y1="358" x2="370" y2="306" class="s-warn" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
<text x="378" y="308" class="tm" font-size="11" text-anchor="start" font-weight="normal">reply lost</text>
<text x="430" y="264" class="tm" font-size="11" text-anchor="middle" font-weight="normal">10 s: timeout, retry</text>
<line x1="430" y1="272" x2="520" y2="358" class="s-accent" stroke-width="1.8" fill="none" marker-end="url(#arrow-accent)"/>
<text x="442" y="302" class="tm" font-size="11" text-anchor="start" font-weight="normal">charge, key A17</text>
<rect x="512" y="360" width="150" height="22" rx="3" class="f-soft-ok" />
<text x="587" y="375" class="t" font-size="11.5" text-anchor="middle" font-weight="600">A17 seen: same result</text>
<line x1="600" y1="358" x2="650" y2="276" class="s-ok" stroke-width="1.8" fill="none" marker-end="url(#arrow-ok)"/>
<text x="660" y="276" class="t" font-size="11.5" text-anchor="start" font-weight="600">paid once</text>
<text x="30" y="408" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Valeria's payments. The amount and key are illustrative.</text>
</svg>
