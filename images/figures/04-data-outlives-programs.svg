<line x1="600" y1="160" x2="553" y2="108" class="s-accent" stroke-width="1.3" fill="none" marker-end="url(#arrow-accent)"/>
<line x1="600" y1="160" x2="553" y2="148" class="s-accent" stroke-width="1.3" fill="none" marker-end="url(#arrow-accent)"/>
<text x="400" y="222" class="t" font-size="12.5" text-anchor="start" font-weight="normal">The hospital question: a few lines, under a minute.</text>
<text x="400" y="244" class="t" font-size="12.5" text-anchor="start" font-weight="normal">But every index is also updated on every write:</text>
<text x="400" y="262" class="t" font-size="12.5" text-anchor="start" font-weight="normal">with fourteen of them, the nightly load went</text>
<text x="400" y="280" class="t" font-size="12.5" text-anchor="start" font-weight="normal">from one hour to six.</text>
</svg>
