<text x="190" y="345" class="t" font-size="12" text-anchor="middle" font-weight="normal">Two nights to answer one new question</text>
<text x="400" y="30" class="t" font-size="15" text-anchor="start" font-weight="600">Facts as tables</text>
<text x="400" y="49" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Linked by values; an index on hospital</text>
