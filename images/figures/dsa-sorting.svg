<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Splitting around a bad pivot, and a good one</title>
<desc id="d">Two diagrams of quicksort on eight records that are already in order. Left: taking the first record as the pivot puts nothing on one side and everything else on the other, so eight levels of splitting are needed. Right: taking the middle value splits the records in half each time, so three levels are enough.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="360" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Pivot: the first record</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">On sorted data, each split removes one record</text>
<rect x="30" y="70" width="34" height="22" rx="3" class="f-amber" />
<rect x="68" y="70" width="262" height="22" rx="3" class="f-soft-warn" />
<rect x="68" y="100" width="34" height="22" rx="3" class="f-amber" />
<rect x="106" y="100" width="224" height="22" rx="3" class="f-soft-warn" />
<rect x="106" y="130" width="34" height="22" rx="3" class="f-amber" />
<rect x="144" y="130" width="186" height="22" rx="3" class="f-soft-warn" />
<rect x="144" y="160" width="34" height="22" rx="3" class="f-amber" />
<rect x="182" y="160" width="148" height="22" rx="3" class="f-soft-warn" />
<rect x="182" y="190" width="34" height="22" rx="3" class="f-amber" />
<rect x="220" y="190" width="110" height="22" rx="3" class="f-soft-warn" />
<rect x="220" y="220" width="34" height="22" rx="3" class="f-amber" />
<rect x="258" y="220" width="72" height="22" rx="3" class="f-soft-warn" />
<rect x="258" y="250" width="34" height="22" rx="3" class="f-amber" />
<rect x="296" y="250" width="34" height="22" rx="3" class="f-soft-warn" />
<rect x="296" y="280" width="34" height="22" rx="3" class="f-amber" />
<rect x="334" y="280" width="0" height="22" rx="3" class="f-soft-warn" />
<text x="30" y="326" class="t" font-size="12.5" text-anchor="start" font-weight="normal">8 levels: grows with n, so n² work in all</text>
<text x="400" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Pivot: a middle value</text>
<text x="400" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Each split halves what's left</text>
<rect x="400" y="70" width="300" height="22" rx="3" class="f-soft-ok" />
<rect x="400" y="100" width="148" height="22" rx="3" class="f-soft-ok" />
<rect x="552" y="100" width="148" height="22" rx="3" class="f-soft-ok" />
<rect x="400" y="130" width="72" height="22" rx="3" class="f-soft-ok" />
<rect x="476" y="130" width="72" height="22" rx="3" class="f-soft-ok" />
<rect x="552" y="130" width="72" height="22" rx="3" class="f-soft-ok" />
<rect x="628" y="130" width="72" height="22" rx="3" class="f-soft-ok" />
<rect x="400" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="438" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="476" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="514" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="552" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="590" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="628" y="160" width="34" height="22" rx="3" class="f-ok" />
<rect x="666" y="160" width="34" height="22" rx="3" class="f-ok" />
<text x="400" y="326" class="t" font-size="12.5" text-anchor="start" font-weight="normal">3 levels below the top: grows with log n, so n log n in all</text>
<text x="30" y="345" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Margit's 1974 night: the orders arrived already sorted, and the first-record pivot did the worst thing possible.</text>
</svg>
