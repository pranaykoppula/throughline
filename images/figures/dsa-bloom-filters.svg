<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d">
<title id="t">A Bloom filter as the crawl outgrew it</title>
<desc id="d">A line chart of how often the crawler's filter wrongly answered 'probably seen', against the number of URLs it held, as a multiple of the number it was sized for. At the size it was built for, one in a hundred. When the crawl tripled, about one in seven, with the curve still climbing. A second, flat line near zero shows the filter resized for twice the new crawl.</desc>

