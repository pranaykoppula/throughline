<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Hashing, then salting</title>
<desc id="d">Three accounts whose passwords are shown with what is stored. Plain hashes: two accounts with the same password store the same hash, and one guess cracks both. Salted hashes: a random salt per account makes every stored value different, so each guess has to be tried against each account.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="330" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Hashed</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">Same password, same hash</text>
<text x="30" y="82" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">account</text>
<text x="120" y="82" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">password</text>
<text x="230" y="82" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">stored</text>
<rect x="30" y="94" width="330" height="30" rx="4" class="f-soft-warn" />
<text x="38" y="114" class="t" font-size="12.5" text-anchor="start" font-weight="normal">anna</text>
<text x="120" y="114" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">fishplate</text>
<text x="230" y="114" class="t" font-size="12.5" text-anchor="start" font-weight="normal">5f1c…a90e</text>
<rect x="30" y="134" width="330" height="30" rx="4" class="f-faint" />
<text x="38" y="154" class="t" font-size="12.5" text-anchor="start" font-weight="normal">ben</text>
<text x="120" y="154" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">dragon42</text>
<text x="230" y="154" class="t" font-size="12.5" text-anchor="start" font-weight="normal">c27d…41b8</text>
<rect x="30" y="174" width="330" height="30" rx="4" class="f-soft-warn" />
<text x="38" y="194" class="t" font-size="12.5" text-anchor="start" font-weight="normal">cara</text>
<text x="120" y="194" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">fishplate</text>
<text x="230" y="194" class="t" font-size="12.5" text-anchor="start" font-weight="normal">5f1c…a90e</text>
<text x="400" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">Salted and hashed</text>
<text x="400" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">A random salt per account</text>
<text x="400" y="82" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">account</text>
<text x="490" y="82" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">password</text>
<text x="600" y="82" class="tm" font-size="11.5" text-anchor="start" font-weight="normal">stored</text>
<rect x="400" y="94" width="330" height="30" rx="4" class="f-faint" />
<text x="408" y="114" class="t" font-size="12.5" text-anchor="start" font-weight="normal">anna</text>
<text x="490" y="114" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">fishplate</text>
<text x="600" y="114" class="t" font-size="12.5" text-anchor="start" font-weight="normal">9b3e…07ad</text>
<rect x="400" y="134" width="330" height="30" rx="4" class="f-faint" />
<text x="408" y="154" class="t" font-size="12.5" text-anchor="start" font-weight="normal">ben</text>
<text x="490" y="154" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">dragon42</text>
<text x="600" y="154" class="t" font-size="12.5" text-anchor="start" font-weight="normal">e81a…5c32</text>
<rect x="400" y="174" width="330" height="30" rx="4" class="f-faint" />
<text x="408" y="194" class="t" font-size="12.5" text-anchor="start" font-weight="normal">cara</text>
<text x="490" y="194" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">fishplate</text>
<text x="600" y="194" class="t" font-size="12.5" text-anchor="start" font-weight="normal">41f0…d96b</text>
<text x="30" y="240" class="t" font-size="12.5" text-anchor="start" font-weight="normal">One guess, "fishplate", hashed once,</text>
<text x="30" y="258" class="t" font-size="12.5" text-anchor="start" font-weight="normal">matches two accounts at the same time.</text>
<text x="400" y="240" class="t" font-size="12.5" text-anchor="start" font-weight="normal">The same guess has to be hashed again</text>
<text x="400" y="258" class="t" font-size="12.5" text-anchor="start" font-weight="normal">with each account's salt. And a slow hash</text>
<text x="400" y="276" class="t" font-size="12.5" text-anchor="start" font-weight="normal">makes every one of those guesses expensive.</text>
<text x="30" y="314" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Hash values are shortened and invented for the picture.</text>
</svg>
