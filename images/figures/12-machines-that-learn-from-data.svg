<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d">
<title id="t">A filter that decays, and one that keeps learning</title>
<desc id="d">The share of spam caught over three years. A filter trained once starts at ninety-nine in a hundred and falls to eighty-five by 2004 as spammers change tactics. A filter retrained every week on fresh reports dips each time spammers change, then recovers.</desc>

