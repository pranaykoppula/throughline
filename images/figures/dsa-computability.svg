<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">Choosing which way to be wrong</title>
<desc id="d">A flow chart of Viktor's scanner. Every program first meets the signature list: a known virus is blocked, fast and certain. The rest meet a scanner that flags anything suspicious, accepting false alarms; unflagged programs pass. Flagged programs run in an isolated sandbox with a time limit: one that does harm is blocked, one that finishes harmlessly passes, and one still running at the limit is held as unknown.</desc>

<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; } .tm { fill: #59636e; }
  .f-ink { fill: #1f2328; } .s-ink { stroke: #1f2328; }
  .f-line { fill: #d0d7de; } .s-line { stroke: #d0d7de; }
  .f-faint { fill: #f6f8fa; } .s-faint { stroke: #f6f8fa; }
  .f-accent { fill: #2a78d6; } .s-accent { stroke: #2a78d6; }
  .f-warn { fill: #d64a4a; } .s-warn { stroke: #d64a4a; }
  .f-ok { fill: #1baa7a; } .s-ok { stroke: #1baa7a; }
  .f-amber { fill: #e09a1a; } .s-amber { stroke: #e09a1a; }
  .f-soft-accent { fill: #ddeaf9; } .f-soft-warn { fill: #f8dede; } .f-soft-ok { fill: #d8f1e8; } .f-soft-amber { fill: #faecd2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; } .tm { fill: #9198a1; }
    .f-ink { fill: #e6edf3; } .s-ink { stroke: #e6edf3; }
    .f-line { fill: #3d444d; } .s-line { stroke: #3d444d; }
    .f-faint { fill: #161b22; } .s-faint { stroke: #161b22; }
    .f-accent { fill: #4c9aff; } .s-accent { stroke: #4c9aff; }
    .f-warn { fill: #ff7b72; } .s-warn { stroke: #ff7b72; }
    .f-ok { fill: #3fb950; } .s-ok { stroke: #3fb950; }
    .f-amber { fill: #e3b341; } .s-amber { stroke: #e3b341; }
    .f-soft-accent { fill: #102a4a; } .f-soft-warn { fill: #4a1c1c; } .f-soft-ok { fill: #0f3a2a; } .f-soft-amber { fill: #3d2e0e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ink"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-accent"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-warn"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-ok"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-amber"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="f-line"/></marker></defs>
<rect width="760" height="400" class="bg"/>
<text x="30" y="32" class="t" font-size="15" text-anchor="start" font-weight="600">No program can decide this for every program</text>
<text x="30" y="51" class="tm" font-size="12.5" text-anchor="start" font-weight="normal">So each stage chooses its mistakes, and everything has a time limit</text>
<rect x="40" y="84" width="230" height="52" rx="6" class="f-soft-accent" />
<rect x="40" y="84" width="230" height="52" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="155" y="108" class="t" font-size="13" text-anchor="middle" font-weight="600">Signature list</text>
<text x="155" y="123" class="tm" font-size="11" text-anchor="middle" font-weight="normal">fast, certain, only the known</text>
<rect x="40" y="176" width="230" height="52" rx="6" class="f-soft-accent" />
<rect x="40" y="176" width="230" height="52" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="155" y="200" class="t" font-size="13" text-anchor="middle" font-weight="600">Suspicious?</text>
<text x="155" y="215" class="tm" font-size="11" text-anchor="middle" font-weight="normal">flags freely: false alarms accepted</text>
<rect x="40" y="268" width="230" height="52" rx="6" class="f-soft-accent" />
<rect x="40" y="268" width="230" height="52" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="155" y="292" class="t" font-size="13" text-anchor="middle" font-weight="600">Sandbox</text>
<text x="155" y="307" class="tm" font-size="11" text-anchor="middle" font-weight="normal">run it, watch it, with a time limit</text>
<line x1="155" y1="136" x2="155" y2="172" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="163" y="158" class="tm" font-size="11" text-anchor="start" font-weight="normal">not known</text>
<line x1="155" y1="228" x2="155" y2="264" class="s-ink" stroke-width="1.5" fill="none" marker-end="url(#arrow-ink)"/>
<text x="163" y="250" class="tm" font-size="11" text-anchor="start" font-weight="normal">flagged</text>
<line x1="274" y1="110" x2="470" y2="110" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="478" y="91" width="180" height="38" rx="6" class="f-soft-warn" />
<rect x="478" y="91" width="180" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="568" y="108" class="t" font-size="12" text-anchor="middle" font-weight="600">blocked</text>
<text x="568" y="122" class="tm" font-size="10" text-anchor="middle" font-weight="normal">a known virus</text>
<line x1="274" y1="202" x2="470" y2="202" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="478" y="183" width="180" height="38" rx="6" class="f-soft-ok" />
<rect x="478" y="183" width="180" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="568" y="200" class="t" font-size="12" text-anchor="middle" font-weight="600">passed</text>
<text x="568" y="214" class="tm" font-size="10" text-anchor="middle" font-weight="normal">nothing suspicious</text>
<line x1="274" y1="282" x2="470" y2="264" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="478" y="245" width="180" height="38" rx="6" class="f-soft-warn" />
<rect x="478" y="245" width="180" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="568" y="262" class="t" font-size="12" text-anchor="middle" font-weight="600">blocked</text>
<text x="568" y="276" class="tm" font-size="10" text-anchor="middle" font-weight="normal">it did harm</text>
<line x1="274" y1="294" x2="470" y2="306" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="478" y="287" width="180" height="38" rx="6" class="f-soft-ok" />
<rect x="478" y="287" width="180" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="568" y="304" class="t" font-size="12" text-anchor="middle" font-weight="600">passed</text>
<text x="568" y="318" class="tm" font-size="10" text-anchor="middle" font-weight="normal">it finished harmlessly</text>
<line x1="274" y1="306" x2="470" y2="348" class="s-ink" stroke-width="1.4" fill="none" marker-end="url(#arrow-ink)"/>
<rect x="478" y="329" width="180" height="38" rx="6" class="f-soft-amber" />
<rect x="478" y="329" width="180" height="38" rx="6" class="s-line" fill="none" stroke-width="1"/>
<text x="568" y="346" class="t" font-size="12" text-anchor="middle" font-weight="600">held: unknown</text>
<text x="568" y="360" class="tm" font-size="10" text-anchor="middle" font-weight="normal">still running at the limit</text>
<text x="666" y="345" class="tm" font-size="11" text-anchor="start" font-weight="normal">neither safe</text>
<text x="666" y="359" class="tm" font-size="11" text-anchor="start" font-weight="normal">nor dangerous</text>
<text x="30" y="392" class="tm" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic">Viktor's scanner. Each stage can still be wrong; what changed is that he chose how.</text>
</svg>
