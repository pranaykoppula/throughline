name: Checks

on:
  push:
  pull_request:

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every copy of the model matches the-model.md
        run: python3 scripts/check_model.py

  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the graph, the map and the figures
        run: |
          python3 scripts/make_graph.py
          python3 scripts/make_map.py
          python3 scripts/make_figures.py
      - name: graph.html, images/map.svg and images/figures are up to date
        run: |
          if [ -n "$(git status --porcelain -- graph.html images)" ]; then
            echo "::error::Generated files are out of date. Run python3 scripts/make_graph.py, python3 scripts/make_map.py and python3 scripts/make_figures.py, then commit the result."
            git status --short -- graph.html images
            exit 1
          fi
