name: Check the model

on:
  push:
  pull_request:

jobs:
  check-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every copy of the model matches the-model.md
        run: python3 scripts/check_model.py
