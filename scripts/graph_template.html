<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline: the graph</title>
<!-- Generated by scripts/make_graph.py from scripts/graph_template.html. Edit those, not graph.html. -->
<style>
  :root { --bg: #161a1f; --panel: rgba(30, 35, 42, 0.92); --ink: #e6edf3; --muted: #8b949e; --line: #30363d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.over-node { cursor: pointer; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); font-size: 13px; }
  #controls { top: 16px; left: 16px; width: 250px; padding: 14px; }
  #controls h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  #controls p { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  #search { width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #0d1117; color: var(--ink); font-size: 13px; margin-bottom: 12px; }
  #search:focus { outline: none; border-color: #58a6ff; }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--muted); }
  .chip.off { opacity: 0.35; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  label.toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px;
    margin-top: 6px; cursor: pointer; user-select: none; }
  #tip { pointer-events: none; padding: 10px 12px; max-width: 320px; display: none; line-height: 1.45; }
  #tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  #tip code { color: var(--muted); font-size: 11px; }
  #tip span { display: block; margin-top: 6px; color: #c9d1d9; font-size: 12px; }
  #tip em { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; font-style: normal; }
  #hint { bottom: 16px; left: 16px; padding: 8px 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<canvas id="graph"></canvas>

<div id="controls" class="panel">
  <h1>The throughline</h1>
  <p>Every page is a node; every link between pages is an edge. The bright chain is the spine, read in order. Hollow nodes are pages nobody has written yet.</p>
  <input id="search" type="search" placeholder="Search pages…" autocomplete="off">
  <div id="legend"></div>
  <label class="toggle"><input type="checkbox" id="show-trunk" checked> Show the reading order</label>
  <label class="toggle"><input type="checkbox" id="show-unwritten" checked> Show unwritten pages</label>
  <label class="toggle"><input type="checkbox" id="show-labels" checked> Show all labels when zoomed in</label>
</div>

<div id="tip" class="panel"></div>
<div id="hint" class="panel">Drag to pan · scroll to zoom · drag a node to pull it · click to open the page</div>

<script>
const DATA = /*DATA*/null;

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
const searchBox = document.getElementById("search");

const nodes = DATA.nodes.map((n, i) => {
  const angle = i * 2.399963;
  const radius = 18 * Math.sqrt(i + 1);
  return { ...n, x: Math.cos(angle) * radius, y: Math.sin(angle) * radius, vx: 0, vy: 0, degree: 0, neighbours: new Set() };
});
const byId = new Map(nodes.map((n) => [n.id, n]));
const links = DATA.links.map((l) => ({ source: byId.get(l.source), target: byId.get(l.target) }));
const trunk = DATA.trunk.map((l) => ({ source: byId.get(l.source), target: byId.get(l.target), trunk: true }));
for (const l of links) {
  l.source.degree++; l.target.degree++;
  l.source.neighbours.add(l.target); l.target.neighbours.add(l.source);
}
for (const n of nodes) {
  n.r = (n.family === "spine" ? 6 : 3.5) + Math.sqrt(n.degree) * 1.3;
  n.color = (DATA.families[n.family] || { color: "#8b949e" }).color;
}

const hiddenFamilies = new Set();
let showTrunk = true, showUnwritten = true, showLabels = true;
let hovered = null, dragged = null, query = "";
let view = { x: 0, y: 0, k: 1 };
let alpha = 1;

function visible(n) {
  return !hiddenFamilies.has(n.family) && (showUnwritten || n.exists);
}

function matches(n) {
  return query && (n.title.toLowerCase().includes(query) || n.id.toLowerCase().includes(query));
}

function tick() {
  const live = nodes.filter(visible);
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      if (d2 > 250000) continue;
      const f = (1400 * alpha) / d2;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }
  const springs = showTrunk ? links.concat(trunk) : links;
  for (const l of springs) {
    const a = l.source, b = l.target;
    if (!visible(a) || !visible(b)) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const rest = l.trunk ? 60 : 80;
    const strength = l.trunk ? 0.25 : 0.5 / Math.min(a.degree || 1, b.degree || 1);
    const f = ((d - rest) / d) * alpha * strength;
    a.vx += dx * f; a.vy += dy * f;
    b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const n of live) {
    n.vx -= n.x * 0.012 * alpha;
    n.vy -= n.y * 0.012 * alpha;
    if (n === dragged) { n.vx = n.vy = 0; continue; }
    n.vx *= 0.6; n.vy *= 0.6;
    n.x += n.vx; n.y += n.vy;
  }
  alpha = Math.max(alpha * 0.985, dragged ? 0.3 : 0);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function toScreen(n) {
  return [n.x * view.k + view.x + innerWidth / 2, n.y * view.k + view.y + innerHeight / 2];
}

function toWorld(sx, sy) {
  return [(sx - innerWidth / 2 - view.x) / view.k, (sy - innerHeight / 2 - view.y) / view.k];
}

function focusSet() {
  if (hovered) return new Set([hovered, ...hovered.neighbours]);
  if (query) return new Set(nodes.filter(matches));
  return null;
}

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const focus = focusSet();
  const dim = (n) => focus && !focus.has(n);

  ctx.lineCap = "round";
  for (const l of links) {
    if (!visible(l.source) || !visible(l.target)) continue;
    const [x1, y1] = toScreen(l.source), [x2, y2] = toScreen(l.target);
    const lit = hovered && (l.source === hovered || l.target === hovered);
    ctx.strokeStyle = lit ? hovered.color : focus ? "rgba(139,148,158,0.06)" : "rgba(139,148,158,0.22)";
    ctx.lineWidth = lit ? 1.6 : 0.8;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  if (showTrunk && !hiddenFamilies.has("spine")) {
    ctx.strokeStyle = focus ? "rgba(230,237,243,0.15)" : "rgba(230,237,243,0.55)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    trunk.forEach((l, i) => {
      const [x1, y1] = toScreen(l.source), [x2, y2] = toScreen(l.target);
      if (i === 0) ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    });
    ctx.stroke();
  }

  for (const n of nodes) {
    if (!visible(n)) continue;
    const [x, y] = toScreen(n);
    const r = n.r * Math.sqrt(view.k);
    ctx.globalAlpha = dim(n) ? 0.15 : 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (n.exists) {
      ctx.fillStyle = n.color; ctx.fill();
    } else {
      ctx.strokeStyle = n.color; ctx.lineWidth = 1.2; ctx.stroke();
    }
    if (n === hovered || matches(n)) {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    if (n.family === "spine") {
      ctx.fillStyle = "#161a1f";
      ctx.font = `600 ${Math.max(8, r * 0.95)}px -apple-system, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(parseInt(n.id, 10)), x, y + 0.5);
    }
  }

  const labelAlpha = showLabels ? Math.min(1, Math.max(0, (view.k - 0.55) * 2.5)) : 0;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const n of nodes) {
    if (!visible(n)) continue;
    const forced = focus ? focus.has(n) : n.family === "spine" || n.family === "reference";
    const a = forced ? 1 : dim(n) ? 0 : labelAlpha;
    if (a <= 0.02) continue;
    const [x, y] = toScreen(n);
    const r = n.r * Math.sqrt(view.k);
    const label = n.family === "spine" ? n.title.replace(/^\d+\.\s*/, "") : n.title;
    ctx.globalAlpha = a;
    ctx.font = `${n === hovered ? 600 : 400} 12px -apple-system, sans-serif`;
    ctx.fillStyle = n.exists ? "#e6edf3" : "#8b949e";
    ctx.fillText(label, x, y + r + 4);
  }
  ctx.globalAlpha = 1;
}

function frame() {
  if (alpha > 0.002) tick();
  draw();
  requestAnimationFrame(frame);
}

function nodeAt(sx, sy) {
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    if (!visible(n)) continue;
    const [x, y] = toScreen(n);
    const d = Math.hypot(sx - x, sy - y);
    const r = n.r * Math.sqrt(view.k) + 4;
    if (d < r && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

function showTip(n, sx, sy) {
  if (!n) { tip.style.display = "none"; return; }
  const links = n.degree === 1 ? "1 link" : `${n.degree} links`;
  const action = n.exists ? "Click to open" : "Not written yet: a branch nobody has started";
  tip.innerHTML = "";
  const b = document.createElement("b"); b.textContent = n.title;
  const code = document.createElement("code"); code.textContent = `${n.id} · ${links}`;
  tip.append(b, code);
  if (n.exists && n.summary) {
    const s = document.createElement("span"); s.textContent = n.summary; tip.append(s);
  }
  const em = document.createElement("em"); em.textContent = action; tip.append(em);
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(sx + 16, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(sy + 16, innerHeight - h - 8) + "px";
}

function openPage(n) {
  if (!n.exists) return;
  const onPages = location.hostname.endsWith("github.io");
  const url = onPages ? n.id.replace(/\.md$/, ".html") : (DATA.base || "") + n.id;
  window.open(url, "_blank", "noopener");
}

let pointer = null;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  const n = nodeAt(e.clientX, e.clientY);
  pointer = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, node: n, moved: false };
  if (n) { dragged = n; alpha = Math.max(alpha, 0.3); }
  canvas.classList.add("dragging");
});

canvas.addEventListener("pointermove", (e) => {
  if (pointer) {
    const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
    if (Math.hypot(dx, dy) > 4) pointer.moved = true;
    if (pointer.node) {
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      pointer.node.x = wx; pointer.node.y = wy;
      alpha = Math.max(alpha, 0.3);
    } else {
      view.x = pointer.vx + dx; view.y = pointer.vy + dy;
    }
    if (pointer.moved) showTip(null);
    return;
  }
  hovered = nodeAt(e.clientX, e.clientY);
  canvas.classList.toggle("over-node", !!hovered);
  showTip(hovered, e.clientX, e.clientY);
});

canvas.addEventListener("pointerup", () => {
  if (pointer && pointer.node && !pointer.moved) openPage(pointer.node);
  pointer = null; dragged = null;
  canvas.classList.remove("dragging");
});

canvas.addEventListener("pointerleave", () => {
  if (!pointer) { hovered = null; showTip(null); }
});

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  const k = Math.min(6, Math.max(0.2, view.k * factor));
  const sx = e.clientX - innerWidth / 2, sy = e.clientY - innerHeight / 2;
  view.x = sx - ((sx - view.x) * k) / view.k;
  view.y = sy - ((sy - view.y) * k) / view.k;
  view.k = k;
}, { passive: false });

searchBox.addEventListener("input", () => { query = searchBox.value.trim().toLowerCase(); });
searchBox.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const n = nodes.find((m) => visible(m) && matches(m));
  if (!n) return;
  view.k = Math.max(view.k, 1.6);
  view.x = -n.x * view.k; view.y = -n.y * view.k;
});

const legend = document.getElementById("legend");
const present = new Set(nodes.map((n) => n.family));
for (const [key, fam] of Object.entries(DATA.families)) {
  if (!present.has(key)) continue;
  const chip = document.createElement("button");
  chip.className = "chip"; chip.type = "button";
  const dot = document.createElement("i"); dot.style.background = fam.color;
  chip.append(dot, document.createTextNode(fam.label));
  chip.addEventListener("click", () => {
    hiddenFamilies.has(key) ? hiddenFamilies.delete(key) : hiddenFamilies.add(key);
    chip.classList.toggle("off", hiddenFamilies.has(key));
    alpha = Math.max(alpha, 0.5);
  });
  legend.append(chip);
}

document.getElementById("show-trunk").addEventListener("change", (e) => { showTrunk = e.target.checked; alpha = Math.max(alpha, 0.5); });
document.getElementById("show-unwritten").addEventListener("change", (e) => { showUnwritten = e.target.checked; alpha = Math.max(alpha, 0.5); });
document.getElementById("show-labels").addEventListener("change", (e) => { showLabels = e.target.checked; });

addEventListener("resize", resize);
resize();
for (let i = 0; i < 300; i++) tick();
alpha = 0.3;
const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) || 1;
view.k = Math.min(1.4, (Math.min(innerWidth, innerHeight) * 0.9) / span);
frame();
</script>
</body>
</html>
